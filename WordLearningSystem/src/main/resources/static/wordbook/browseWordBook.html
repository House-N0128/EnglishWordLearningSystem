<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 词书浏览</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei",sans-serif; }
        body { background-color:#f5f5f5; display:flex; flex-direction:column; min-height:100vh; }
        .top-nav { background-color:#007bff; color:white; display:flex; justify-content:space-between; align-items:center; padding:12px 20px; }
        .nav-title { font-size:18px; font-weight:600; }
        .user-area { display:flex; align-items:center; gap:15px; }
        .user-name { font-size:15px; }
        .btn-nav { background-color:rgba(255,255,255,0.2); color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:14px; }
        .btn-nav:hover { background-color:rgba(255,255,255,0.3); }
        .main-container { display:flex; flex:1; }
        .sidebar { width:180px; background-color:white; border-right:1px solid #eee; padding:20px 0; }
        .sidebar-menu { list-style:none; }
        .sidebar-menu li { padding:12px 25px; cursor:pointer; color:#333; font-size:15px; transition:background-color 0.2s; }
        .sidebar-menu li:hover { background-color:#f0f7ff; color:#007bff; }
        .content-area { flex:1; padding:30px; }
        .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .page-title { font-size:22px; color:#333; font-weight:600; }
        .btn-back { background-color:#6c757d; color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:15px; }
        .search-area { background-color:white; padding:20px; border-radius:6px; margin-bottom:25px; box-shadow:0 2px 8px rgba(0,0,0,0.05); display:flex; align-items:center; gap:15px; flex-wrap:wrap; }
        .filter-select { padding:8px 12px; border:1px solid #eee; border-radius:6px; font-size:14px; min-width:120px; }
        .search-input { flex:1; min-width:200px; padding:8px 12px; border:1px solid #eee; border-radius:6px; font-size:15px; }
        .btn-search { background-color:#007bff; color:white; border:none; padding:8px 20px; border-radius:6px; cursor:pointer; }
        .book-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:25px; margin-bottom:30px; }
        .book-card { background-color:white; border-radius:8px; padding:25px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
        .book-title-row { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:15px; }
        .book-name { font-size:18px; font-weight:600; color:#333; }
        .level-tag { padding:3px 8px; border-radius:10px; font-size:12px; font-weight:500; }
        .level-beginner { background-color:#c3e6cb; color:#155724; }
        .level-intermediate { background-color:#ffeeba; color:#856404; }
        .level-advanced { background-color:#f5c6cb; color:#721c24; }
        .word-count { font-size:14px; color:#666; margin-bottom:15px; }
        .book-desc { font-size:13px; color:#666; line-height:1.6; margin-bottom:20px; }
        .book-footer { display:flex; justify-content:space-between; align-items:center; }
        .create-time { font-size:12px; color:#999; }
        .card-buttons { display:flex; gap:10px; }
        .btn-start { background-color:#007bff; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
        .empty-hint { text-align:center; color:#999; padding:40px; }
        footer { background-color:#343a40; color:#aaa; text-align:center; padding:20px; font-size:12px; margin-top:auto; }
        .footer-links { margin-bottom:8px; }
        .footer-links a { color:#aaa; text-decoration:none; margin:0 10px; }
        .footer-links a:hover { color:white; }
    </style>
</head>
<body>
<div class="top-nav">
    <div class="nav-title">单词学习平台</div>
    <div class="user-area">
        <span class="user-name" id="display-name">用户</span>
        <button class="btn-nav" onclick="window.location.href='../user/getUserInfo.html'">个人中心</button>
        <button class="btn-nav" onclick="clearAuth()">退出登录</button>
    </div>
</div>
<div class="main-container">
    <div class="sidebar">
        <ul class="sidebar-menu">
            <li onclick="window.location.href='../user/index.html'">首页</li>
            <li style="background:#f0f7ff;color:#007bff;">词书浏览</li>
            <li onclick="window.location.href='../word/searchWord.html'">单词查询</li>
            <li onclick="window.location.href='../collection/manageCollectedWord.html'">我的收藏</li>
            <li onclick="window.location.href='../wordlearningrecord/viewPersonalStudyRecord.html'">学习记录</li>
            <li onclick="window.location.href='../user/getUserInfo.html'">个人信息</li>
            <li onclick="window.location.href='../user/changePassword.html'">修改密码</li>
            <li onclick="window.location.href='../user/cancelUser.html'">注销账号</li>
        </ul>
    </div>
    <div class="content-area">
        <div class="page-header">
            <h1 class="page-title">词书浏览</h1>
            <button class="btn-back" onclick="window.location.href='../user/index.html'">返回首页</button>
        </div>
        <div class="search-area">
            <label style="font-size:14px;color:#333;">难度等级:</label>
            <select class="filter-select" id="level-filter" onchange="renderBooks()">
                <option value="">全部</option><option value="初级">初级</option><option value="中级">中级</option><option value="高级">高级</option>
            </select>
            <input type="text" class="search-input" id="name-search" placeholder="输入词书名称搜索" oninput="renderBooks()">
        </div>
        <div class="book-grid" id="book-grid"></div>
    </div>
</div>
<footer>
    <div class="footer-links"><a href="#">版权信息</a><a href="#">客服链接</a></div>
    <div>版权所有 &copy; 2025 单词学习平台</div>
</footer>
<script src="../api.js"></script>
<script>
if (!requireAuth('user')) { /* redirect */ }
document.getElementById('display-name').textContent = '用户名：' + (localStorage.getItem('userId') || '');

var allBooks = [];
apiGet('/api/wordbooks').then(function(r) { if (r.code === 200) { allBooks = r.data; renderBooks(); } });

function renderBooks() {
    var level = document.getElementById('level-filter').value;
    var name = document.getElementById('name-search').value.toLowerCase();
    var filtered = allBooks.filter(function(b) {
        return (!level || b.difficultyLevel === level) && (!name || b.wordBookName.toLowerCase().indexOf(name) >= 0);
    });
    var html = '';
    filtered.forEach(function(b) {
        var cls = b.difficultyLevel === '初级' ? 'level-beginner' : (b.difficultyLevel === '高级' ? 'level-advanced' : 'level-intermediate');
        html += '<div class="book-card">' +
            '<div class="book-title-row"><div class="book-name">' + b.wordBookName + '</div><div class="level-tag ' + cls + '">' + b.difficultyLevel + '</div></div>' +
            '<div class="word-count">' + b.wordCount + ' 个单词</div>' +
            '<div class="book-desc">' + (b.wordBookDescription || '暂无简介') + '</div>' +
            '<div class="book-footer"><div class="create-time">' + (b.createTime || '') + '</div>' +
            '<div class="card-buttons"><button class="btn-start" onclick="window.location.href=\'../wordlearningrecord/recordWordStudy.html?bookId=' + b.wordBookId + '\'">开始学习</button></div></div>' +
            '</div>';
    });
    document.getElementById('book-grid').innerHTML = filtered.length ? html : '<div class="empty-hint">暂无匹配词书</div>';
}
</script>
</body>
</html>
