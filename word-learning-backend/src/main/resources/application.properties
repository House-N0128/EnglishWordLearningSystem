spring.application.name=WordLearningSystem

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/word_study?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true

# ==================== 阿里云短信服务 ====================
aliyun.sms.access-key-id=your-access-key-id
aliyun.sms.access-key-secret=your-access-key-secret
aliyun.sms.sign-name=阿里云短信测试
aliyun.sms.template-code=SMS_154950909

# ==================== QQ邮箱 SMTP ====================
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=your-qq-email@qq.com
spring.mail.password=your-smtp-auth-code
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.default-encoding=UTF-8
