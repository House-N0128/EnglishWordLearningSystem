<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 注册</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",sans-serif; }
        body { background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .register-card { background:#fff; width:450px; border-radius:12px; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
        .card-header { background-color:#21a049; color:#fff; text-align:center; padding:20px; }
        .card-header h1 { font-size:22px; margin-bottom:8px; }
        .card-header p { font-size:14px; opacity:0.9; }
        .card-body { padding:30px 40px; background-color:#f5f5f5; }
        .form-group { margin-bottom:20px; }
        .form-group label { display:block; font-size:14px; color:#333; margin-bottom:8px; }
        .form-group input { width:100%; height:42px; padding:0 12px; border:1px solid #ddd; border-radius:6px; font-size:14px; }
        .form-group .hint { font-size:12px; color:#888; margin-top:4px; }
        .row { display:flex; gap:20px; } .row .form-group { flex:1; }
        .agreement { display:flex; align-items:center; font-size:13px; color:#555; margin-bottom:25px; }
        .agreement input { margin-right:8px; width:auto; }
        .agreement a { color:#2196f3; text-decoration:none; }
        .btn { width:100%; height:46px; border:none; border-radius:6px; font-size:16px; cursor:pointer; margin-bottom:12px; }
        .btn-register { background-color:#28a745; color:#fff; }
        .btn-register:hover { background-color:#218838; }
        .btn-back { background-color:#6c757d; color:#fff; }
        .btn-back:hover { background-color:#5a6268; }
        .error-msg { display:none; text-align:center; font-size:14px; color:#e74c3c; background:#fef0ef; padding:8px; border-radius:6px; margin-bottom:12px; }
    </style>
</head>
<body>
<div class="register-card">
    <div class="card-header"><h1>单词学习平台</h1><p>创建您的学习账户</p></div>
    <div class="card-body">
        <div class="error-msg" id="error-msg"></div>
        <div class="form-group"><label>登录账号</label><input type="text" id="userId" placeholder="请输入账号"><div class="hint">账号应为字母数字组合</div></div>
        <div class="form-group"><label>登录密码</label><input type="password" id="password" placeholder="请输入密码（6-20位）"><div class="hint">密码长度6-20位</div></div>
        <div class="form-group"><label>确认密码</label><input type="password" id="confirmPassword" placeholder="请再次输入密码"></div>
        <div class="form-group"><label>用户昵称</label><input type="text" id="userName" placeholder="请输入昵称"><div class="hint">昵称长度为2-10个字符</div></div>
        <div class="row">
            <div class="form-group"><label>联系电话</label><input type="tel" id="phoneNumber" placeholder="请输入手机号"></div>
            <div class="form-group"><label>邮箱地址</label><input type="email" id="email" placeholder="请输入邮箱"></div>
        </div>
        <div class="agreement"><input type="checkbox" id="agreement"><label for="agreement">我已阅读并同意 <a href="#">《用户服务协议》</a> 和 <a href="#">《隐私政策》</a></label></div>
        <button class="btn btn-register" onclick="doRegister()">注册</button>
        <button class="btn btn-back" onclick="window.location.href='../index.html'">返回登录</button>
    </div>
</div>
<script src="../api.js"></script>
<script>
function showError(msg) { var e=document.getElementById('error-msg'); e.textContent=msg; e.style.display='block'; }
function doRegister() {
    var userId = document.getElementById('userId').value.trim();
    var password = document.getElementById('password').value.trim();
    var confirm = document.getElementById('confirmPassword').value.trim();
    if (!userId || !password) { showError('请输入账号和密码'); return; }
    if (password !== confirm) { showError('两次密码不一致'); return; }
    if (!document.getElementById('agreement').checked) { showError('请阅读并同意服务协议'); return; }
    apiPost('/api/user/register', {
        userId: userId, loginPassword: password,
        userName: document.getElementById('userName').value.trim() || userId,
        phoneNumber: document.getElementById('phoneNumber').value.trim() || '',
        email: document.getElementById('email').value.trim() || ''
    }).then(function(r) {
        if (r.code === 200) { alert('注册成功！请返回登录'); window.location.href = '../index.html'; }
        else { showError(r.message); }
    });
}
</script>
</body>
</html>
