<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 注册</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins','Microsoft Yahei',sans-serif; }
        body { background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; position:relative; overflow:hidden; }
        body::before { content:''; position:absolute; width:200%; height:200%; background:radial-gradient(circle,rgba(255,255,255,0.1) 1px,transparent 1px); background-size:40px 40px; animation:bgMove 20s linear infinite; }
        @keyframes bgMove { 0% { transform:translate(0,0); } 100% { transform:translate(40px,40px); } }
        .register-card { background:rgba(255,255,255,0.98); backdrop-filter:blur(10px); width:520px; max-width:100%; border-radius:32px; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); transition:transform 0.3s,box-shadow 0.3s; position:relative; z-index:1; animation:fadeInUp 0.5s; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        .register-card:hover { transform:translateY(-5px); box-shadow:0 30px 60px -12px rgba(0,0,0,0.3); }
        .card-header { background:linear-gradient(135deg, #10b981 0%, #059669 100%); color:white; text-align:center; padding:35px 20px; position:relative; }
        .card-header::after { content:'📝'; position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); font-size:40px; background:white; width:60px; height:60px; border-radius:30px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 15px rgba(0,0,0,0.2); }
        .card-header h1 { font-size:28px; margin-bottom:8px; font-weight:700; }
        .card-header p { font-size:14px; opacity:0.9; }
        .card-body { padding:35px 40px; background:white; }
        .error-msg { display:none; text-align:center; font-size:14px; color:#e74c3c; background:linear-gradient(135deg,#fee2e2,#fecaca); padding:12px; border-radius:16px; margin-bottom:20px; font-weight:500; }
        .form-group { margin-bottom:22px; }
        .form-group label { display:block; font-size:14px; font-weight:600; color:#4a4b65; margin-bottom:8px; }
        .form-group input { width:100%; padding:14px 16px; border:2px solid #eef2ff; border-radius:16px; font-size:15px; outline:none; transition:all 0.3s; background:#f8f9ff; }
        .form-group input:focus { border-color:#10b981; background:white; box-shadow:0 0 0 4px rgba(16,185,129,0.1); }
        .form-group .hint { font-size:12px; color:#8b8ca3; margin-top:6px; }
        .row { display:flex; gap:20px; }
        .row .form-group { flex:1; }
        .agreement { display:flex; align-items:center; font-size:13px; color:#555; margin:25px 0; padding:12px; background:#f8f9ff; border-radius:16px; }
        .agreement input { width:18px; height:18px; margin-right:10px; cursor:pointer; }
        .agreement a { color:#10b981; text-decoration:none; font-weight:600; }
        .btn { width:100%; height:50px; border:none; border-radius:40px; font-size:16px; font-weight:600; cursor:pointer; margin-bottom:15px; transition:all 0.3s; position:relative; overflow:hidden; }
        .btn::before { content:''; position:absolute; top:50%; left:50%; width:0; height:0; border-radius:50%; background:rgba(255,255,255,0.3); transform:translate(-50%,-50%); transition:width 0.6s,height 0.6s; }
        .btn:hover::before { width:300px; height:300px; }
        .btn-register { background:linear-gradient(135deg, #10b981 0%, #059669 100%); color:white; box-shadow:0 4px 15px rgba(16,185,129,0.4); }
        .btn-register:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(16,185,129,0.5); }
        .btn-back { background:linear-gradient(135deg, #6c757d 0%, #495057 100%); color:white; }
        .btn-back:hover { transform:translateY(-2px); }
        @media (max-width:550px) { .card-body { padding:25px 20px; } .row { flex-direction:column; gap:0; } }
    </style>
</head>
<body>
<div class="register-card">
    <div class="card-header"><h1>📝 单词学习平台</h1><p>创建您的学习账户</p></div>
    <div class="card-body">
        <div class="error-msg" id="error-msg"></div>
        <div class="form-group"><label>📱 登录账号</label><input type="text" id="userId" placeholder="请输入账号"><div class="hint">账号应为字母数字组合</div></div>
        <div class="form-group"><label>🔒 登录密码</label><input type="password" id="password" placeholder="请输入密码（6-20位）"><div class="hint">密码长度6-20位</div></div>
        <div class="form-group"><label>✅ 确认密码</label><input type="password" id="confirmPassword" placeholder="请再次输入密码"></div>
        <div class="form-group"><label>👤 用户昵称</label><input type="text" id="userName" placeholder="请输入昵称"><div class="hint">昵称长度为2-10个字符</div></div>
        <div class="row">
            <div class="form-group"><label>📞 联系电话</label><input type="tel" id="phoneNumber" placeholder="请输入手机号"></div>
            <div class="form-group"><label>📧 邮箱地址</label><input type="email" id="email" placeholder="请输入邮箱"></div>
        </div>
        <div class="agreement"><input type="checkbox" id="agreement"><label>我已阅读并同意 <a href="#">《用户服务协议》</a> 和 <a href="#">《隐私政策》</a></label></div>
        <button class="btn btn-register" onclick="doRegister()">✨ 注册新账号</button>
        <button class="btn btn-back" onclick="window.location.href='../index.html'">← 返回登录</button>
    </div>
</div>
<script src="../api.js"></script>
<script>
function showError(msg) { var e=document.getElementById('error-msg'); e.textContent=msg; e.style.display='block'; setTimeout(function(){e.style.display='none';},3000); }
function doRegister() {
    var userId = document.getElementById('userId').value.trim();
    var password = document.getElementById('password').value.trim();
    var confirm = document.getElementById('confirmPassword').value.trim();
    var userName = document.getElementById('userName').value.trim();
    if (!userId || !password) { showError('请输入账号和密码'); return; }
    if (password !== confirm) { showError('两次密码不一致'); return; }
    if (password.length < 6) { showError('密码长度至少6位'); return; }
    if (!document.getElementById('agreement').checked) { showError('请阅读并同意服务协议'); return; }
    apiPost('/api/user/register', {
        userId: userId, loginPassword: password,
        userName: userName || userId,
        phoneNumber: document.getElementById('phoneNumber').value.trim() || '',
        email: document.getElementById('email').value.trim() || ''
    }).then(function(r) {
        if (r.code === 200) { alert('🎉 注册成功！请返回登录'); window.location.href = '../index.html'; }
        else { showError(r.message); }
    });
}
</script>
</body>
</html>
