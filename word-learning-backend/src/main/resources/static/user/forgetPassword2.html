<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置新密码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4a88f4 0%, #8a4fc9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: #fff;
            width: 380px;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-item {
            margin-bottom: 20px;
        }

        .input-item input {
            width: 100%;
            height: 48px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 15px;
            outline: none;
        }

        .input-item input:focus {
            border-color: #4a88f4;
        }

        .btn {
            width: 100%;
            height: 48px;
            background-color: #4a88f4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .back {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .back a {
            color: #4a88f4;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="title">设置新密码</div>
    <div class="input-item">
        <input type="password" placeholder="请输入新密码">
    </div>
    <div class="input-item">
        <input type="password" placeholder="请确认新密码">
    </div>
    <button class="btn">确定</button>
    <div class="back">
        <a href="login.html">返回登录</a>
    </div>
</div>
</body>
</html>
