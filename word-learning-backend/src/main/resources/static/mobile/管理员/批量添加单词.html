<style>* { margin:0; padding:0; box-sizing:border-box; }

<body>

<div class="header">
  <span class="btn-back" onclick="history.back()">← 返回</span>
  <span class="header-title">批量导入单词</span>
</div>

<div class="main-panel">
  <div class="page-title">选择要上传的 Excel 文件</div>

  <div class="form-group">
    <label>所属词书</label>
    <input  type="text" inputmode="text" autocomplete="off" spellcheck="false" type="text" id="bookName" placeholder="请输入所属词书" required inputmode="text" autocomplete="off" spellcheck="false">
  </div>

  <div class="form-group">
    <label>上传文件</label>
    <button type="button" class="upload-btn" id="uploadBtn">点击选择 Excel 文件</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls">
  </div>

  <div class="word-list" id="wordList">
    <!-- Excel解析结果会显示在这里 -->
  </div>

  <button class="btn-add" id="submitBtn">确认批量添加</button>
</div>

<!-- SheetJS库 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const wordList = document.getElementById('wordList');

uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

let parsedData = [];

function handleFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type:'array'});
    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
    parsedData = XLSX.utils.sheet_to_json(firstSheet, {header:1});
    displayWords(parsedData);
  };
  reader.readAsArrayBuffer(file);
}

function displayWords(data){
  wordList.innerHTML = '';
  data.forEach((row, idx) => {
    if(row.length === 0) return;
    const text = `${idx+1}. ${row.join(' | ')}`;
    const div = document.createElement('div');
    div.textContent = text;
    wordList.appendChild(div);
  });
}

document.getElementById('submitBtn').addEventListener('click', () => {
  const book = document.getElementById('bookName').value.trim();
  if(!book){
    alert('请填写所属词书！');
    return;
  }
  if(parsedData.length === 0){
    alert('请先选择 Excel 文件！');
    return;
  }
  alert(`成功将 ${parsedData.length} 条单词添加到词书：${book}`);
  // TODO: 这里可以加 AJAX 提交到后端
});
</script>
