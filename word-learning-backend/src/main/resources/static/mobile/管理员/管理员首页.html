<!DOCTYPE html>
<html lang="zh">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta charset="UTF-8">
<title>管理员首页(App端)</title>
<style>
body {margin:0;padding-bottom:65px;font-family:'PingFang SC',Arial,sans-serif;background:linear-gradient(135deg,#f2f8fc 0%, #eaf4ff 100%);}
.top-bar {height:48px;background:#318af8;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
.admin-user {font-weight:bold;}
.btn-logout {background:#fff;color:#318af8;font-weight:600;font-size:15px;border:none;border-radius:16px;padding:7px 20px;}
.main-panel {padding:0 12px;}
.dashboard-title {font-size:19px;color:#318af8;font-weight:700;margin:20px 0 10px 0;}
.info-grid {display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.info-card {background:#fff;border-radius:13px;box-shadow:0 1px 6px #dde6fa19;padding:13px 0;text-align:center;}
.num {font-size:19px;font-weight:bold;color:#318af8;}
.section-block {background:#fff;border-radius:11px;padding:15px 10px;margin:18px 0 10px 0;box-shadow:0 1px 8px #dde6fa19;}
.section-title {font-size:16px;color:#318af8;font-weight:600;margin-bottom:14px;}
.top-books-list {display:flex;flex-direction:column;gap:12px;}
.top-book-item {background:#318af81a;border-radius:7px;padding:10px 13px;font-size:15px;}
.book-name {font-weight:600;color:#318af8;font-size:15px;}
.count {margin-left:7px;font-size:13px;color:#276bab;}
.admin-navbar{position:fixed;left:0;bottom:0;width:100vw;height:61px;background:#fff;box-shadow:0 -2px 18px #b4cafab8;border-top-left-radius:14px;border-top-right-radius:14px;display:flex;justify-content:space-around;align-items:center;}
.admin-nav-btn{flex:1;text-align:center;color:#318af8;font-size:15px;font-weight:600;padding:0;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
.admin-nav-btn.active{color:#17c2ae;}
.admin-navbar i{font-style:normal;font-size:22px;margin-bottom:2px;font-family:'Arial','PingFang SC';}
</style>
<script src="/mobile/api.js"></script>
</head>
<body>
  <div class="top-bar">
    <span class="admin-user">管理员：<span id="display-name">admin001</span></span>
    <button class="btn-logout" onclick="clearAuth()">退出登录</button>
  </div>
  <main class="main-panel">
    <div class="dashboard-title">平台数据总览</div>
    <div class="info-grid">
      <div class="info-card"><span class="num" id="stat-today">-</span><span>今日学习记录</span></div>
    </div>
    <div class="section-block">
      <div class="section-title">热门词书TOP3</div>
      <div class="top-books-list">
        <div class="top-book-item">
          <span class="book-name">英语四级词书</span>
          <span class="count">1225人</span>
        </div>
        <div class="top-book-item">
          <span class="book-name">雅思进阶</span>
          <span class="count">932人</span>
        </div>
        <div class="top-book-item">
          <span class="book-name">托福词汇</span>
          <span class="count">810人</span>
        </div>
      </div>
    </div>
  </main>
  <div class="admin-navbar">
    <button class="admin-nav-btn active" onclick="window.location.href='管理员首页.html'"><i>🏠</i>主页</button>
    <button class="admin-nav-btn" onclick="window.location.href='用户管理.html'"><i>👥</i>用户管理</button>
    <button class="admin-nav-btn" onclick="window.location.href='词书管理.html'"><i>📚</i>词书管理</button>
    <button class="admin-nav-btn" onclick="window.location.href='单词管理.html'"><i>🗃️</i>单词管理</button>
  </div>

<script>
if (!requireAuth('admin')) throw new Error('unauthorized');
document.getElementById('display-name').innerText = localStorage.getItem('userId')||'admin';
apiGet('/api/admin/stats').then(function(r){if(r.code===200&&r.data){document.getElementById('stat-users').innerText=r.data.userCount;document.getElementById('stat-books').innerText=r.data.wordBookCount;document.getElementById('stat-words').innerText=r.data.wordCount;document.getElementById('stat-today').innerText=r.data.todayRecordCount;}});
apiGet('/api/wordbooks').then(function(r){var b=document.getElementById('book-list');if(r.code===200&&r.data&&r.data.length>0){b.innerHTML=r.data.slice(0,5).map(function(x){return '<div class=top-book-item><span class=book-name>'+x.wordBookName+'</span><span class=count>'+x.wordCount+'词</span></div>';}).join('');}});
</script>
</body>
</html>
