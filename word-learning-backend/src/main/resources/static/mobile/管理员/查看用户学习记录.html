<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>用户学习记录（管理员）</title>
<style>
body {
  margin:0;
  background:linear-gradient(135deg,#f2f8fc 0%, #eaf4ff 100%);
  font-family:'PingFang SC','Inter','HarmonyOS Sans',Arial,sans-serif;
  padding-bottom:20px;
}

/* 顶部栏（加入返回按钮版） */
.top-bar {
  display:flex;
  align-items:center;
  background:#318af8;
  color:#fff;
  padding:13px 18px 12px 6px;
  border-bottom-left-radius:18px;
  border-bottom-right-radius:18px;
  box-shadow:0 2px 12px #318af82a;
  font-size:18px;
  font-weight:600;
  gap:11px;
}

.back-btn {
  background:none;
  border:none;
  outline:none;
  cursor:pointer;
  padding:5px 5px 5px 2px;
  display:flex;
  align-items:center;
}

.back-icon { width:30px; height:30px; display:inline-block; }

.main-panel { padding:20px 16px; }

.user-info-box {
  background:#fff;
  padding:14px;
  border-radius:12px;
  box-shadow:0 1px 6px #dde6fa50;
  font-size:15px;
  margin-bottom:18px;
  color:#273245;
}

.section-title {
  font-size:18px;
  font-weight:700;
  color:#318af8;
  margin:18px 0 10px 0;
}

.stats-bar {
  font-size:15px;
  margin-bottom:12px;
  color:#273245;
}

.record-table {
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px #dde6fa40;
}

.record-table th, .record-table td {
  padding:11px 0;
  text-align:center;
  font-size:14px;
  border-bottom:1px solid #f2f2fc;
  color:#318af8;
}

.record-table th {
  background:#f7faff;
  font-weight:600;
}

.record-table tr:last-child td {
  border-bottom:none;
}
</style>
<script src="/mobile/api.js"></script>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="window.location.href='getUserInfo.html'">
    <span class="back-icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M18 6l-8 8 8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>
  用户学习记录
</div>

<div class="main-panel">

  <!-- 用户基本信息 -->
  <div class="user-info-box" id="userInfoBox">
    用户ID：<strong><span id="uid-display">-</span></strong><br>
    账号：<span id="uname-display">-</span><br>
    昵称：<span id="nick-display">-</span><br>
    注册时间：<span id="reg-display">-</span>
  </div>

  <!-- 统计数据 -->
  <div class="section-title">学习统计</div>
  <div class="stats-bar">
    总学习: <strong id="stat-total">-</strong> ｜ 日均: <strong id="stat-avg">-</strong>
  </div>

  <!-- 学习记录表 -->
  <div class="section-title">学习记录明细</div>

  <table class="record-table"><thead><tr><th>日期</th><th>词书</th><th>词数</th></tr></thead><tbody id="record-body"><tr><td colspan="3" style="text-align:center;color:#8899aa;padding:16px;">加载中...</td></tr></tbody></table>

</div>

<script>
// 从URL取用户ID
const urlParams = new URLSearchParams(window.location.search);
const uid = urlParams.get('userId');
console.log("管理员正在查看用户ID:", uid);
</script>

<script>if(!requireAuth("admin"))throw new Error("unauthorized");document.getElementById("display-name")?document.getElementById("display-name").innerText=localStorage.getItem("userId")||"admin":0;</script>

<script>
var uid=new URLSearchParams(window.location.search).get('userId')||'';
if(uid){document.getElementById('uid-display').innerText=uid;
apiGet('/api/admin/records?userId='+uid).then(function(r){var d=r.code===200&&r.data?r.data:[];document.getElementById('stat-total').innerText=d.length;var m={};d.forEach(function(x){var k=x.learningDate;m[k]=(m[k]||0)+1});var days=Object.keys(m).length;document.getElementById('stat-avg').innerText=days?(d.length/days).toFixed(1):0;var agg=[];Object.keys(m).forEach(function(k){agg.push({date:k,count:m[k]})});agg.sort(function(a,b){return b.date.localeCompare(a.date)});var tb=document.getElementById('record-body');tb.innerHTML=agg.length?agg.map(function(x){return'<tr><td>'+x.date+'</td><td>-</td><td>'+x.count+'词</td></tr>'}).join(''):'<tr><td colspan=3 style=text-align:center;color:#8899aa;padding:16px;>暂无记录</td></tr>';});}
</script>
</body>
</html>
