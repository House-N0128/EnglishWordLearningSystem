<!DOCTYPE html>
<html lang="zh">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta charset="UTF-8">
<title>单词管理(App端)</title>
<style>
body {margin:0;padding-bottom:65px;font-family:'PingFang SC',Arial,sans-serif;background:linear-gradient(135deg,#f2f8fc 0%, #eaf4ff 100%);}
.top-bar {height:48px;background:#318af8;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
.admin-user {font-weight:bold;}
.btn-logout {background:#fff;color:#318af8;font-weight:600;font-size:15px;border:none;border-radius:16px;padding:7px 20px;}
.main-panel {padding:8px 12px;}
.page-title {font-size:19px;color:#318af8;font-weight:700;margin:15px 0;}
.search-row {display:flex;gap:7px;margin-bottom:12px;}
.search-row input,.search-row select {padding:6px 8px;border-radius:7px;border:1px solid #c7d9ee;font-size:14px;background:#f6f8fc;}
.search-btn {background:#318af8;color:#fff;border:none;border-radius:12px;font-size:14px;padding:7px 18px;}
.btn-group {display:flex;gap:10px;margin-bottom:11px;}
.add-btn {background:#318af8;color:#fff;border:none;border-radius:12px;font-size:14px;padding:8px 0;flex:1;}
.word-card {background:#fff;margin-bottom:13px;border-radius:12px;box-shadow:0 1px 6px #dde6fa16;padding:13px;}
.word-card .row{margin-bottom:3px;}
.action-btn {background:#318af8;color:#fff;border:none;border-radius:11px;padding:6px 14px;font-size:13px;margin-right:4px;}
.action-btn.cancel {background:#e0e6f2;color:#318af8;}
.admin-navbar{position:fixed;left:0;bottom:0;width:100vw;height:61px;background:#fff;box-shadow:0 -2px 18px #b4cafab8;border-top-left-radius:14px;border-top-right-radius:14px;display:flex;justify-content:space-around;align-items:center;}
.admin-nav-btn{flex:1;text-align:center;color:#318af8;font-size:15px;font-weight:600;padding:0;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
.admin-nav-btn.active{color:#17c2ae;}
.admin-navbar i{font-style:normal;font-size:22px;margin-bottom:2px;font-family:'Arial','PingFang SC';}
</style>
<script src="/mobile/api.js"></script>
</head>
<body>
  <div class="top-bar"><span class="admin-user">管理员：admin001</span>
    <button class="btn-logout" onclick="window.location.href='signin.html'">退出登录</button>
  </div>
  <div class="main-panel">
    <div class="page-title">单词管理</div>
    <form class="search-row">
      <input type="text" placeholder="英文拼写/单词ID">
      <select>
        <option>所属词书</option>
      </select>
      <select>
        <option>单词状态</option>
        <option>全部</option>
        <option>已上架</option>
        <option>未上架</option>
      </select>
      <button type="submit" class="search-btn">查询</button>
    </form>
    <div class="btn-group">
      <button class="add-btn" onclick="window.location.href='addWord.html'">新增单词</button>
      <button class="add-btn" onclick="window.location.href='batchAddWord.html'">批量导入</button>
    </div>
    <div class="word-card">
      <div class="row">单词ID: W1058 | 词书: 英语四级词书 | 拼写: mock | 词性: n. | 音标: [mɒk]</div>
      <div class="row">创建: 2025-06-02 | 更新: 2025-06-03 | 状态: 已上架</div>
      <div>
        <button class="action-btn">编辑</button>
        <button class="action-btn cancel">删除</button>
        <button class="action-btn" onclick="window.location.href='viewWordDetail.html'">详情</button>
      </div>
    </div>
  </div>
  <div class="admin-navbar">
    <button class="admin-nav-btn" onclick="window.location.href='indexAdmin-app.html'"><i>🏠</i>主页</button>
    <button class="admin-nav-btn" onclick="window.location.href='manageUserAdmin-app.html'"><i>👥</i>用户管理</button>
    <button class="admin-nav-btn" onclick="window.location.href='manageWordBookAdmin-app.html'"><i>📚</i>词书管理</button>
    <button class="admin-nav-btn active" onclick="window.location.href='manageWordAdmin-app.html'"><i>🗃️</i>单词管理</button>
  </div>
`n<script>
if (!requireAuth("admin")) { throw new Error("unauthorized"); }

function loadWords() {
  apiGet("/api/wordbooks").then(function(r) {
    if (r.code !== 200 || !r.data || r.data.length === 0) { document.getElementById("word-list").innerHTML = '<div style="text-align:center;color:#8899aa;padding:16px;">暂无词书</div>'; return; }
    var box = document.getElementById("word-list");
    box.innerHTML = "";
    r.data.forEach(function(b) {
      apiGet("/api/words?wordBookId=" + b.wordBookId).then(function(wr) {
        if (wr.code === 200 && wr.data) {
          wr.data.forEach(function(w) {
            box.innerHTML += `<div class="collection-item">
              <div class="word-name">` + (w.englishSpelling||"") + ` <span class="word-pos">` + (w.phoneticSymbol||"") + `</span></div>
              <div class="word-meaning">` + (w.chineseDefinition||"") + `</div>
              <div class="word-meta">词书: ` + (b.wordBookName||"") + `</div>
              <button class="action-btn" onclick="editWord('` + w.wordId + `')">编辑</button>
              <button class="action-btn cancel" onclick="delWord('` + w.wordId + `')">删除</button>
            </div>`;
          });
        }
      });
    });
  });
}

function delWord(id) { if (!confirm("确定删除该单词？")) return; apiDelete("/api/words/" + id).then(function(r) { alert(r.message); location.reload(); }); }
function editWord(id) { location.href = "编辑单词.html?wordId=" + id; }

loadWords();
</script>
`n</body>
</html>
