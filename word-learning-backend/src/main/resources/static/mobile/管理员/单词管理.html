.btn {
  padding: 8px 16px; border-radius: 20px; border: none;
  font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: all .15s;
}
.btn:active { transform: scale(0.95); }
.btn-primary { background: #3577ef; color: #fff; }
.btn-danger  { background: #fff; color: #e53e3e; border: 1px solid #fed7d7; }
.btn-success { background: #38a169; color: #fff; }
.btn-outline { background: #fff; color: #3577ef; border: 1px solid #bee3f8; }
.form-group { margin-bottom: 14px; }
.form-label { font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 5px; display: block; }

}
.form-input:focus { outline: none; border-color: #3577ef; background: #fff; }
textarea.form-input { min-height: 80px; resize: vertical; }
select.form-input { appearance: none; }
.msg { display: none; text-align: center; padding: 10px; border-radius: 10px; font-size:16px; margin: 8px 0; }
.msg-error { background: #fff5f5; color: #c53030; }
.msg-success { background: #f0fff4; color: #276749; }
.navbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #fff; box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
  border-radius: 20px 20px 0 0;
  display: flex; justify-content: space-around;
  padding: 8px 0 12px 0; z-index: 100;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: pointer; border: none; background: none;
  font-family: inherit; font-size: 11px; color: #8899aa;
}
.nav-item .nav-icon { font-size: 20px; }
.nav-item.active { color: #3577ef; font-weight: 600; }
.search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
.search-bar input { flex: 1; }
.empty { text-align: center; color: #8899aa; padding: 32px; font-size:16px; }
/* ==== IME中文输入强制修复 ==== */

`n<script>
if (!requireAuth("admin")) { throw new Error("unauthorized"); }

function loadWords() {
  apiGet("/api/wordbooks").then(function(r) {
    if (r.code !== 200 || !r.data || r.data.length === 0) { document.getElementById("word-list").innerHTML = '<div style="text-align:center;color:#8899aa;padding:16px;">暂无词书</div>'; return; }
    var box = document.getElementById("word-list");
    box.innerHTML = "";
    r.data.forEach(function(b) {
      apiGet("/api/words?wordBookId=" + b.wordBookId).then(function(wr) {
        if (wr.code === 200 && wr.data) {
          wr.data.forEach(function(w) {
            box.innerHTML += `<div class="collection-item">
              <div class="word-name">` + (w.englishSpelling||"") + ` <span class="word-pos">` + (w.phoneticSymbol||"") + `</span></div>
              <div class="word-meaning">` + (w.chineseDefinition||"") + `</div>
              <div class="word-meta">词书: ` + (b.wordBookName||"") + `</div>
              <button class="action-btn" onclick="editWord('` + w.wordId + `')">编辑</button>
              <button class="action-btn cancel" onclick="delWord('` + w.wordId + `')">删除</button>
            </div>`;
          });
        }
      });
    });
  });
}

function delWord(id) { if (!confirm("确定删除该单词？")) return; apiDelete("/api/words/" + id).then(function(r) { alert(r.message); location.reload(); }); }
function editWord(id) { location.href = "编辑单词.html?wordId=" + id; }

loadWords();
</script>
