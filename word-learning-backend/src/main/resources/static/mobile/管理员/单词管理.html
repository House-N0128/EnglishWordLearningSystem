<!DOCTYPE html>
<html lang="zh">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta charset="UTF-8">
<title>单词管理(App端)</title>
<style>
body {margin:0;padding-bottom:65px;font-family:'PingFang SC',Arial,sans-serif;background:linear-gradient(135deg,#f2f8fc 0%, #eaf4ff 100%);}
.top-bar {height:48px;background:#318af8;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
.admin-user {font-weight:bold;}
.btn-logout {background:#fff;color:#318af8;font-weight:600;font-size:15px;border:none;border-radius:16px;padding:7px 20px;}
.main-panel {padding:8px 12px;}
.page-title {font-size:19px;color:#318af8;font-weight:700;margin:15px 0;}
.search-row {display:flex;gap:7px;margin-bottom:12px;}
.search-row input,.search-row select {padding:6px 8px;border-radius:7px;border:1px solid #c7d9ee;font-size:14px;background:#f6f8fc;}
.search-btn {background:#318af8;color:#fff;border:none;border-radius:12px;font-size:14px;padding:7px 18px;}
.btn-group {display:flex;gap:10px;margin-bottom:11px;}
.add-btn {background:#318af8;color:#fff;border:none;border-radius:12px;font-size:14px;padding:8px 0;flex:1;}
.word-card {background:#fff;margin-bottom:13px;border-radius:12px;box-shadow:0 1px 6px #dde6fa16;padding:13px;}
.word-card .row{margin-bottom:3px;}
.action-btn {background:#318af8;color:#fff;border:none;border-radius:11px;padding:6px 14px;font-size:13px;margin-right:4px;}
.action-btn.cancel {background:#e0e6f2;color:#318af8;}
.admin-navbar{position:fixed;left:0;bottom:0;width:100vw;height:61px;background:#fff;box-shadow:0 -2px 18px #b4cafab8;border-top-left-radius:14px;border-top-right-radius:14px;display:flex;justify-content:space-around;align-items:center;}
.admin-nav-btn{flex:1;text-align:center;color:#318af8;font-size:15px;font-weight:600;padding:0;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
.admin-nav-btn.active{color:#17c2ae;}
.admin-navbar i{font-style:normal;font-size:22px;margin-bottom:2px;font-family:'Arial','PingFang SC';}
</style>
<script src="/mobile/api.js"></script>
</head>
<body>
  <div class="top-bar"><span class="admin-user">管理员：<span id="display-name">admin001</span></span>
    <button class="btn-logout" onclick="clearAuth()">退出登录</button>
  </div>
  <div class="main-panel">
    <div class="page-title">单词管理</div>
    <div class="search-row"><input type="text" placeholder="输入英文搜索" id="search-kw"><button class="search-btn" onclick="doSearch()">搜索</button></div>
    <div class="btn-group">
      <button class="add-btn" onclick="window.location.href='添加单词.html'">新增单词</button>
      <button class="add-btn" onclick="window.location.href='batch添加单词.html'">批量导入</button>
    </div>
    <div id="word-list"></div></div><div class="admin-navbar">
    <button class="admin-nav-btn" onclick="window.location.href='管理员首页.html'"><i>🏠</i>主页</button>
    <button class="admin-nav-btn" onclick="window.location.href='用户管理.html'"><i>👥</i>用户管理</button>
    <button class="admin-nav-btn" onclick="window.location.href='词书管理.html'"><i>📚</i>词书管理</button>
    <button class="admin-nav-btn active" onclick="window.location.href='单词管理.html'"><i>🗃️</i>单词管理</button>
  </div>
<script>if(!requireAuth("admin"))throw new Error("unauthorized");document.getElementById("display-name")?document.getElementById("display-name").innerText=localStorage.getItem("userId")||"admin":0;</script>

<script>
function doSearch(){var k=document.getElementById('search-kw').value.trim();if(!k)return;var b=document.getElementById('word-list');b.innerHTML='搜索中...';apiGet('/api/words/search?keyword='+encodeURIComponent(k)).then(function(r){if(r.code===200&&r.data&&r.data.length>0){b.innerHTML=r.data.map(function(w){return'<div class=word-card><div class=row>单词: '+w.englishSpelling+' | 音标: '+(w.phoneticSymbol||'')+'</div><div class=row>释义: '+w.chineseDefinition+'</div>'+(w.exampleSentence?'<div class=row>例句: '+w.exampleSentence+'</div>':'')+'<div><button class=action-btn onclick=location.href=\'编辑单词.html?wordId='+w.wordId+'\'>编辑</button><button class=action-btn cancel onclick=delWord(\''+w.wordId+'\')>删除</button></div></div>';}).join('');}else{b.innerHTML='<div style=text-align:center;color:#8899aa;padding:20px;>未找到</div>';}});}
function delWord(id){if(!confirm('确定删除？'))return;apiDelete('/api/words/'+id).then(function(r){alert(r.message);doSearch();});}
</script>
</body>
</html>
