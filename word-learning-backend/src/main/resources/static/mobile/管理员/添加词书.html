<!DOCTYPE html>
<html lang="zh">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta charset="UTF-8">
<title>新增词书(App端)</title>
<style>
html, body {height:100%;margin:0;padding:0;}
body {
  font-family:'PingFang SC',Arial,sans-serif;
  background:linear-gradient(135deg,#f2f8fc 0%, #eaf4ff 100%);
  display:flex;
  flex-direction:column;
  color:#273245;
}

/* 顶栏 */
.top-bar {
  display:flex;
  align-items:center;
  background:#318af8;
  color:#fff;
  padding:15px 18px 14px 6px;
  border-bottom-left-radius:18px;
  border-bottom-right-radius:18px;
  box-shadow:0 2px 12px #318af82a;
  font-size:18px;
  font-weight:600;
  gap:11px;
}
.back-btn {
  background:none;border:none;outline:none;cursor:pointer;
  padding:5px;display:flex;align-items:center;
}
.back-icon {width:30px;height:30px;display:inline-block;}

/* 主体内容 */
.main-panel {
  flex-grow:1;
  overflow-y:auto;
  padding:16px;
  padding-bottom:20px;
}

.page-title {font-size:19px;color:#318af8;font-weight:700;margin-bottom:14px;}

.form-group {margin-bottom:12px; display:flex; flex-direction:column;}
.form-group label {margin-bottom:4px; font-weight:600; color:#318af8;}
.form-group input, .form-group select, .form-group textarea {
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #c7d9ee;
  font-size:15px;
  background:#f6f8fc;
  outline:none;
}
textarea {resize:vertical; min-height:70px;}

.btn-add {
  width:100%;
  padding:12px 0;
  background:linear-gradient(90deg,#3577ef 60%,#6cc3ff 100%);
  color:#fff;
  font-weight:600;
  font-size:17px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  margin-top:10px;
  box-shadow:0 2px 8px #e3f2fd;
}
</style>
<script src="/mobile/api.js"></script>
</head>
<body>

<!-- 顶栏 -->
<div class="top-bar">
  <button class="back-btn" onclick="window.history.back()">
    <span class="back-icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M18 6l-8 8 8 8" stroke="#fff" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>
  新增词书
</div>

<div class="main-panel">
  <div class="page-title">创建新的词书</div>

  <form id="addBookForm">

    <div class="form-group">
      <label>词书 ID</label>
      <input type="text" id="bookId" readonly placeholder="系统自动生成" style="color:#8899aa;">
    </div>

    <div class="form-group">
      <label>词书名称</label>
      <input type="text" id="bookName" placeholder="请输入词书名称" required>
    </div>

    <div class="form-group">
      <label>词书简介</label>
      <textarea id="bookDesc" placeholder="请输入词书简介"></textarea>
    </div>

    <div class="form-group">
      <label>难度等级</label>
      <select id="level" required>
        <option value="">请选择</option>
        <option value="初级">初级</option>
        <option value="中级">中级</option>
        <option value="高级">高级</option>
      </select>
    </div>

    <div class="form-group">
      <label>状态</label>
      <select id="status" required>
        <option value="">请选择</option>
        <option value="已上架">已上架</option>
        <option value="未上架">未上架</option>
      </select>
    </div>

    <button type="submit" class="btn-add">创建词书</button>
  </form>

</div>

<script>
const form = document.getElementById('addBookForm');

form.onsubmit = function(e){
  e.preventDefault();

  const id = bookId.value.trim();
  const name = bookName.value.trim();
  const desc = bookDesc.value.trim();
  const level = level.value;
  const status = status.value;

  if (!id || !name || !level || !status){
    alert("请填写所有必填字段！");
    return;
  }

  alert(
    "词书创建成功！\n" +
    `词书 ID：${id}\n` +
    `名称：${name}\n` +
    `简介：${desc}\n` +
    `难度：${level}\n` +
    `状态：${status}`
  );

  form.reset();
};
</script>

<script>if(!requireAuth("admin"))throw new Error("unauthorized");document.getElementById("display-name")?document.getElementById("display-name").innerText=localStorage.getItem("userId")||"admin":0;</script>

<script>
document.getElementById('addBookForm').onsubmit=function(e){e.preventDefault();var n=document.getElementById('bookName').value.trim();var d=document.getElementById('bookDesc').value.trim();var l=document.getElementById('level').value;if(!n||!l){alert('请填写必填字段');return}apiPost('/api/wordbooks',{wordBookName:n,difficultyLevel:l,wordBookDescription:d}).then(function(r){if(r.code===200){alert('创建成功！');location.href='词书管理.html'}else{alert(r.message)}});};
</script>
</body>
</html>
