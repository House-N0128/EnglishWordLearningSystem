<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>用户管理(App端)</title>
<style>
body {margin:0;padding-bottom:65px;font-family:'PingFang SC',Arial,sans-serif;background:linear-gradient(135deg,#f2f8fc 0%, #eaf4ff 100%);}
.top-bar {height:48px;background:#318af8;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
.admin-user {font-weight:bold;}
.btn-logout {background:#fff;color:#318af8;font-weight:600;font-size:15px;border:none;border-radius:16px;padding:7px 20px;}
.main-panel {padding:8px 12px;}
.page-title {font-size:19px;color:#318af8;font-weight:700;margin:15px 0;}
.search-row {display:flex;gap:8px;margin-bottom:14px;}
.search-row input,.search-row select {padding:6px 8px;border-radius:7px;border:1px solid #c7d9ee;font-size:14px;background:#f6f8fc;}
.search-btn {background:#318af8;color:#fff;border:none;border-radius:12px;font-size:14px;padding:8px 20px;}
.pager {display:flex;gap:8px;justify-content:center;margin:10px 0;}
.pager-btn {background:#318af8; color:#fff; border:none; border-radius:14px; padding:5px 13px;font-size:13px;}
.admin-navbar{position:fixed;left:0;bottom:0;width:100vw;height:61px;background:#fff;box-shadow:0 -2px 18px #b4cafab8;border-top-left-radius:14px;border-top-right-radius:14px;display:flex;justify-content:space-around;align-items:center;}
.admin-nav-btn{flex:1;text-align:center;color:#318af8;font-size:15px;font-weight:600;padding:0;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
.admin-nav-btn.active{color:#17c2ae;}
.admin-navbar i{font-style:normal;font-size:22px;margin-bottom:2px;font-family:'Arial','PingFang SC';}
</style>
<script src="/mobile/api.js"></script>
</head>
<body>
  <div class="top-bar">
    <span class="admin-user">管理员：<span id="display-name">admin001</span></span>
    <button class="btn-logout" onclick="clearAuth()">退出登录</button>
  </div>
  <div class="main-panel">
    <div class="page-title">用户管理</div>
    <div class="search-row"><input type="text" placeholder="用户ID/昵称" id="search-kw"><select id="filter-status"><option value="">全部状态</option><option value="正常">正常</option><option value="冻结">冻结</option></select><button class="search-btn" onclick="doSearch()">查询</button></div>
    <div id="user-list"></div>
  </div>

  <div class="admin-navbar">
    <button class="admin-nav-btn" onclick="window.location.href='管理员首页.html'"><i>🏠</i>主页</button>
    <button class="admin-nav-btn active"><i>👥</i>用户管理</button>
    <button class="admin-nav-btn" onclick="window.location.href='词书管理.html'"><i>📚</i>词书管理</button>
    <button class="admin-nav-btn" onclick="window.location.href='单词管理.html'"><i>🗃️</i>单词管理</button>
  </div>

<script>
// 搜索跳转到查询结果页面
document.getElementById('searchForm').onsubmit = function(e){
  e.preventDefault();
  const keyword = document.getElementById('keyword').value.trim();
  if(keyword) window.location.href = `查询寻用户结果.html?keyword=${encodeURIComponent(keyword)}`;
}
</script>

<script>if(!requireAuth("admin"))throw new Error("unauthorized");document.getElementById("display-name")?document.getElementById("display-name").innerText=localStorage.getItem("userId")||"admin":0;</script>

<script>
function doSearch(){var k=document.getElementById('search-kw').value.trim();if(!k)return;var b=document.getElementById('user-list');b.innerHTML='搜索中...';apiGet('/api/admin/users?keyword='+k).then(function(r){if(r.code===200&&r.data){var d=r.data;var s=document.getElementById('filter-status').value;if(s)d=d.filter(function(u){return u.accountStatus===s});b.innerHTML=d.length?d.map(function(u){return'<div class=book-card style=background:#fff;padding:12px;margin-bottom:10px;border-radius:12px;><div class=row>'+u.userName+' ('+u.userId+') | 状态: '+(u.accountStatus||'正常')+'</div><div class=row>'+ (u.phoneNumber||'')+' | '+(u.email||'')+'</div><div class=row>注册: '+(u.registerTime||'').substring(0,10)+'</div><div><button class=action-btn onclick=toggleUser(\''+u.userId+'\',\''+(u.accountStatus||'正常')+'\')>'+((u.accountStatus||'正常')==='冻结'?'解冻':'冻结')+'</button><button class=action-btn onclick=location.href=\'查看用户学习记录.html?userId='+u.userId+'\'>学习记录</button></div></div>';}).join(''):'<div style=text-align:center;color:#8899aa;padding:20px;>未找到</div>';}});}
function toggleUser(id,st){var ns=st==='冻结'?'正常':'冻结';if(!confirm('确定'+(ns==='冻结'?'冻结':'解冻')+'？'))return;apiPut('/api/admin/users/'+id,{accountStatus:ns}).then(function(r){alert(r.message);doSearch();});}
</script>
</body>
</html>
