<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 修改用户信息</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei",sans-serif; }
        body { background:linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height:100vh; }
        .top-nav { background:linear-gradient(135deg, #dc3545 0%, #c82333 100%); color:white; display:flex; justify-content:space-between; align-items:center; padding:15px 25px; box-shadow:0 2px 15px rgba(220,53,69,0.3); }
        .nav-title { font-size:20px; font-weight:600; letter-spacing:1px; }
        .user-area { display:flex; align-items:center; gap:20px; }
        .user-name { font-size:15px; }
        .btn-logout { background-color:rgba(255,255,255,0.2); color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:14px; transition:all 0.3s; }
        .btn-logout:hover { background-color:rgba(255,255,255,0.3); transform:translateY(-1px); }
        .main-container { display:flex; min-height:calc(100vh - 60px); }
        .sidebar { width:200px; background:white; border-right:1px solid #e0e0e0; padding:25px 0; box-shadow:2px 0 15px rgba(0,0,0,0.05); }
        .sidebar-menu { list-style:none; }
        .sidebar-menu li { padding:14px 25px; cursor:pointer; color:#444; font-size:15px; transition:all 0.3s; border-left:3px solid transparent; }
        .sidebar-menu li:hover { background-color:#fff5f5; color:#dc3545; border-left-color:#dc3545; }
        .sidebar-menu li.active { background-color:#f8d7da; color:#dc3545; border-left-color:#dc3545; }
        .content-area { flex:1; padding:30px; }
        .page-title { font-size:26px; color:#333; font-weight:600; margin-bottom:25px; display:flex; align-items:center; gap:10px; }
        .page-icon { font-size:28px; }
        .form-card { background:white; padding:40px; border-radius:15px; box-shadow:0 8px 25px rgba(0,0,0,0.08); max-width:650px; }
        .form-card-header {
            padding-bottom:20px;
            margin-bottom:30px;
            border-bottom:2px solid #f0f0f0;
        }
        .form-card-title {
            font-size:20px;
            font-weight:600;
            color:#333;
            display:flex;
            align-items:center;
            gap:10px;
        }
        .form-group { margin-bottom:25px; }
        .form-label { display:block; font-size:15px; color:#444; margin-bottom:10px; font-weight:600; }
        .form-input {
            width:100%;
            padding:14px 18px;
            border:2px solid #e0e0e0;
            border-radius:10px;
            font-size:15px;
            transition:all 0.3s;
            background:#fafafa;
        }
        .form-input:focus {
            outline:none;
            border-color:#dc3545;
            background:white;
            box-shadow:0 0 0 3px rgba(220,53,69,0.1);
        }
        .form-input:disabled {
            background-color:#f0f0f0;
            color:#999;
            border-color:#e0e0e0;
        }
        .btn-group { display:flex; gap:15px; margin-top:40px; }
        .btn {
            padding:13px 30px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:15px;
            font-weight:600;
            transition:all 0.3s;
        }
        .btn-save {
            background:linear-gradient(135deg, #28a745 0%, #218838 100%);
            color:white;
        }
        .btn-save:hover {
            transform:translateY(-2px);
            box-shadow:0 5px 15px rgba(40,167,69,0.4);
        }
        .btn-cancel {
            background:linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            color:white;
        }
        .btn-cancel:hover {
            transform:translateY(-2px);
            box-shadow:0 5px 15px rgba(108,117,141,0.4);
        }
        .toast-msg {
            position:fixed;
            bottom:30px;
            right:30px;
            background:#333;
            color:white;
            padding:16px 24px;
            border-radius:10px;
            font-size:14px;
            z-index:1000;
            opacity:0;
            transition:all 0.3s;
            pointer-events:none;
            box-shadow:0 5px 20px rgba(0,0,0,0.3);
        }
        .loading-overlay {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            display:flex;
            justify-content:center;
            align-items:center;
            z-index:2000;
            display:none;
        }
        .loading-spinner {
            background:white;
            padding:30px 45px;
            border-radius:15px;
            font-size:16px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
<div class="top-nav">
    <div class="nav-title">单词学习平台 - 管理员系统</div>
    <div class="user-area">
        <span class="user-name" id="admin-name">管理员</span>
        <button class="btn-logout" onclick="clearAuth()">退出登录</button>
    </div>
</div>
<div class="main-container">
    <div class="sidebar">
        <ul class="sidebar-menu">
            <li onclick="window.location.href='indexAdmin.html'">管理员首页</li>
            <li onclick="window.location.href='adminPersonal.html'">个人中心</li>
            <li class="active">用户管理</li>
            <li onclick="window.location.href='../wordbook/manageWordBookAdmin.html'">词书管理</li>
            <li onclick="window.location.href='../word/manageWordAdmin.html'">单词管理</li>
            <li onclick="window.location.href='../wordlearningrecord/viewUserLearningRecords.html'">学习记录查询</li>
        </ul>
    </div>
    <div class="content-area">
        <h1 class="page-title"><span class="page-icon">✏️</span>修改用户信息</h1>
        <div class="form-card">
            <div class="form-card-header">
                <div class="form-card-title">👤 用户资料编辑</div>
            </div>
            <div class="form-group">
                <label class="form-label">用户ID</label>
                <input type="text" class="form-input" id="userId" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">用户昵称</label>
                <input type="text" class="form-input" id="userName" placeholder="请输入用户昵称">
            </div>
            <div class="form-group">
                <label class="form-label">联系电话</label>
                <input type="text" class="form-input" id="phoneNumber" placeholder="请输入联系电话">
            </div>
            <div class="form-group">
                <label class="form-label">邮箱地址</label>
                <input type="email" class="form-input" id="email" placeholder="请输入邮箱地址">
            </div>
            <div class="btn-group">
                <button class="btn btn-save" onclick="save()">💾 保存修改</button>
                <button class="btn btn-cancel" onclick="goBack()">🚫 返回</button>
            </div>
        </div>
    </div>
</div>
<div class="toast-msg" id="toastMsg">提示信息</div>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">加载中...</div>
</div>
<script src="../api.js"></script>
<script>
if (!requireAuth('admin')) { /* redirect */ }
document.getElementById('admin-name').textContent = '管理员：' + (localStorage.getItem('userId') || '');

var currentUserId = '';

function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

function showMessage(msg, isError) {
    var toast = document.getElementById('toastMsg');
    toast.textContent = msg;
    toast.style.backgroundColor = isError ? '#dc3545' : '#28a745';
    toast.style.opacity = '1';
    setTimeout(function() { toast.style.opacity = '0'; }, 2000);
}

function loadUserInfo() {
    var params = new URLSearchParams(window.location.search);
    currentUserId = params.get('userId');
    console.log('loadUserInfo, userId from URL:', currentUserId);
    
    if (!currentUserId) {
        showMessage('缺少用户ID', true);
        return;
    }
    
    // 通过搜索用户列表获取用户信息
    showLoading();
    apiGet('/api/admin/users?keyword=' + currentUserId).then(function(r) {
        hideLoading();
        console.log('loadUserInfo API response:', r);
        if (r.code === 200 && r.data && r.data.length > 0) {
            var user = r.data.find(function(u) { return u.userId === currentUserId; });
            if (user) {
                document.getElementById('userId').value = user.userId || '';
                document.getElementById('userName').value = user.userName || '';
                document.getElementById('phoneNumber').value = user.phoneNumber || '';
                document.getElementById('email').value = user.email || '';
            } else {
                showMessage('未找到用户信息', true);
            }
        } else {
            showMessage(r.message || '获取用户信息失败', true);
        }
    }).catch(function(error) {
        hideLoading();
        console.error('loadUserInfo error:', error);
        showMessage('获取用户信息失败: ' + error.message, true);
    });
}

function save() {
    console.log('save called, currentUserId:', currentUserId);
    
    var data = {
        userName: document.getElementById('userName').value.trim(),
        phoneNumber: document.getElementById('phoneNumber').value.trim(),
        email: document.getElementById('email').value.trim()
    };
    
    console.log('save data:', data);
    
    if (!data.userName) {
        showMessage('请输入用户昵称', true);
        return;
    }
    
    if (!currentUserId) {
        showMessage('用户ID为空，请重新进入编辑页面', true);
        return;
    }
    
    showLoading();
    apiPut('/api/admin/users/' + currentUserId, data).then(function(r) {
        hideLoading();
        console.log('API response:', r);
        if (r.code === 200) {
            showMessage('用户信息修改成功');
            setTimeout(function() { window.location.href = 'manageUserAdmin.html'; }, 1500);
        } else {
            showMessage(r.message || '修改失败', true);
        }
    }).catch(function(error) {
        hideLoading();
        console.error('API error:', error);
        showMessage('修改失败: ' + (error.message || '网络错误'), true);
    });
}

function goBack() {
    window.location.href = 'manageUserAdmin.html';
}

loadUserInfo();
</script>
</body>
</html>
