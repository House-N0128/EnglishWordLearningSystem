<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 管理员登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4a88f4 0%, #8a4fc9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: #ffffff;
            width: 400px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .card-header h1 {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card-header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .tab-bar {
            display: flex;
            border-bottom: 1px solid #eee;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            background-color: #f8f9fa;
            transition: all 0.2s;
        }

        .tab.active {
            background-color: white;
            color: #007bff;
            border-bottom: 2px solid #007bff;
        }

        .form-content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #007bff;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 15px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-login {
            background-color: #007bff;
            color: white;
        }

        .btn-forget {
            background-color: #6c757d;
            color: white;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .footer-links a {
            color: #007bff;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .warning-tip {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="card-header">
        <h1>单词学习平台</h1>
        <p>管理员登录</p>
    </div>
    <div class="tab-bar">
        <div class="tab">普通用户</div>
        <div class="tab active">管理员</div>
    </div>
    <div class="form-content">
        <div class="form-group">
            <label>管理员账号</label>
            <input type="text" placeholder="请输入您的账号">
        </div>
        <div class="form-group">
            <label>登录密码</label>
            <input type="password" placeholder="请输入您的密码">
        </div>
        <button class="btn btn-login">登录</button>
        <button class="btn btn-forget">忘记密码</button>
        <div class="footer-links">
            <a href="#">账号问题咨询</a>
            <a href="#">隐私政策</a>
        </div>
        <div class="warning-tip">
            <span>⚠️</span>
            管理员账号仅用于系统管理，请勿泄露
        </div>
    </div>
</div>
</body>
</html>
