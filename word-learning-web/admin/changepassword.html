<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改登录密码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #dc3545;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            font-size: 14px;
        }

        .btn-logout {
            background-color: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .form-card {
            background-color: white;
            width: 420px;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            margin-top: 80px;
        }

        .page-title {
            font-size: 22px;
            color: #333;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #007bff;
        }

        .form-input.error {
            border-color: #dc3545;
            background-color: #fff5f5;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .input-tip {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 35px;
        }

        .btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }

        .toast-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            display: none;
        }

        .loading-spinner {
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            font-size: 15px;
            color: #333;
        }
    </style>
    <script src="../api.js"></script>
</head>
<body>
    <div class="top-nav">
        <div class="nav-title">单词学习平台 - 管理员系统</div>
        <div class="user-area">
            <span class="user-name" id="topAdminName">管理员：admin</span>
            <button class="btn-logout" onclick="handleLogout()">退出登录</button>
        </div>
    </div>

    <div class="form-card">
        <div class="page-title">修改登录密码</div>
        <form id="changePwdForm">
            <div class="form-group">
                <label class="form-label">原密码 <span style="color:#dc3545;">*</span></label>
                <input type="password" class="form-input" id="oldPassword" placeholder="请输入原密码" autocomplete="current-password">
                <div class="error-message" id="oldPwdError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">新密码 <span style="color:#dc3545;">*</span></label>
                <input type="password" class="form-input" id="newPassword" placeholder="请输入新密码" autocomplete="new-password">
                <div class="input-tip">密码长度至少6位，建议包含数字和字母</div>
                <div class="error-message" id="newPwdError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">确认新密码 <span style="color:#dc3545;">*</span></label>
                <input type="password" class="form-input" id="confirmPassword" placeholder="请再次输入新密码" autocomplete="new-password">
                <div class="error-message" id="confirmPwdError"></div>
            </div>
            <div class="btn-group">
                <button type="button" class="btn btn-submit" onclick="submitChangePwd()">确认修改</button>
                <button type="button" class="btn btn-cancel" onclick="goBack()">取消</button>
            </div>
        </form>
    </div>

    <div class="toast-msg" id="toastMsg"></div>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">处理中...</div>
    </div>

    <script>
        // 页面加载时显示当前管理员名称
        window.onload = function() {
            let userId = localStorage.getItem("userId") || "admin";
            document.getElementById("topAdminName").innerText = "管理员：" + userId;
        };

        // 显示提示消息
        function showMsg(text, isErr = false) {
            let toast = document.getElementById("toastMsg");
            toast.innerText = text;
            toast.style.backgroundColor = isErr ? "#dc3545" : "#28a745";
            toast.style.opacity = "1";
            setTimeout(() => {
                toast.style.opacity = "0";
            }, 2500);
        }

        // 显示加载状态
        function showLoading() {
            document.getElementById("loadingOverlay").style.display = "flex";
        }

        function hideLoading() {
            document.getElementById("loadingOverlay").style.display = "none";
        }

        // 清除错误样式
        function clearErrors() {
            document.getElementById("oldPwdError").style.display = "none";
            document.getElementById("newPwdError").style.display = "none";
            document.getElementById("confirmPwdError").style.display = "none";
            document.getElementById("oldPassword").classList.remove("error");
            document.getElementById("newPassword").classList.remove("error");
            document.getElementById("confirmPassword").classList.remove("error");
        }

        // 表单验证
        function validateForm() {
            clearErrors();
            let isValid = true;

            const oldPwd = document.getElementById("oldPassword").value.trim();
            const newPwd = document.getElementById("newPassword").value.trim();
            const confirmPwd = document.getElementById("confirmPassword").value.trim();

            // 验证原密码
            if (!oldPwd) {
                document.getElementById("oldPwdError").innerText = "请输入原密码";
                document.getElementById("oldPwdError").style.display = "block";
                document.getElementById("oldPassword").classList.add("error");
                isValid = false;
            }

            // 验证新密码
            if (!newPwd) {
                document.getElementById("newPwdError").innerText = "请输入新密码";
                document.getElementById("newPwdError").style.display = "block";
                document.getElementById("newPassword").classList.add("error");
                isValid = false;
            } else if (newPwd.length < 6) {
                document.getElementById("newPwdError").innerText = "密码长度至少6位";
                document.getElementById("newPwdError").style.display = "block";
                document.getElementById("newPassword").classList.add("error");
                isValid = false;
            }

            // 验证确认密码
            if (!confirmPwd) {
                document.getElementById("confirmPwdError").innerText = "请确认新密码";
                document.getElementById("confirmPwdError").style.display = "block";
                document.getElementById("confirmPassword").classList.add("error");
                isValid = false;
            } else if (newPwd !== confirmPwd) {
                document.getElementById("confirmPwdError").innerText = "两次输入的密码不一致";
                document.getElementById("confirmPwdError").style.display = "block";
                document.getElementById("confirmPassword").classList.add("error");
                isValid = false;
            }

            return isValid;
        }

        // 提交修改密码
        async function submitChangePwd() {
            if (!validateForm()) {
                return;
            }

            const userId = localStorage.getItem("userId") || "admin";
            const oldPwd = document.getElementById("oldPassword").value.trim();
            const newPwd = document.getElementById("newPassword").value.trim();
            const confirmPwd = document.getElementById("confirmPassword").value.trim();

            showLoading();

            try {
                const res = await apiPost("/api/admin/changePassword", {
                    userId: userId,
                    oldPassword: oldPwd,
                    newPassword: newPwd,
                    confirmPassword: confirmPwd
                });

                if (res.code === 200) {
                    showMsg("密码修改成功！");
                    setTimeout(() => {
                        window.location.href = "adminPersonal.html";
                    }, 1500);
                } else {
                    showMsg(res.message || "修改失败", true);
                }
            } catch (error) {
                console.error("修改密码失败:", error);
                showMsg("修改密码失败: " + (error.message || "网络错误"), true);
            } finally {
                hideLoading();
            }
        }

        // 返回个人中心
        function goBack() {
            window.location.href = "adminPersonal.html";
        }

        // 退出登录
        function handleLogout() {
            if (confirm("确定要退出登录吗？")) {
                localStorage.removeItem("token");
                localStorage.removeItem("userId");
                showMsg("已退出登录");
                setTimeout(() => {
                    window.location.href = "../login.html";
                }, 1000);
            }
        }
    </script>
</body>
</html>
