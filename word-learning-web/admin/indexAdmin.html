<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 管理员首页</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei",sans-serif; }
        body { background-color:#f5f5f5; display:flex; flex-direction:column; min-height:100vh; }
        .top-nav { background-color:#dc3545; color:white; display:flex; justify-content:space-between; align-items:center; padding:12px 20px; }
        .nav-title { font-size:18px; font-weight:600; }
        .user-area { display:flex; align-items:center; gap:15px; }
        .user-name { font-size:14px; }
        .btn-logout { background-color:rgba(255,255,255,0.2); color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
        .btn-logout:hover { background-color:rgba(255,255,255,0.3); }
        .main-container { display:flex; flex:1; }
        .sidebar { width:180px; background-color:white; border-right:1px solid #eee; padding:20px 0; }
        .sidebar-menu { list-style:none; }
        .sidebar-menu li { padding:12px 25px; cursor:pointer; color:#333; font-size:15px; transition:background-color 0.2s; }
        .sidebar-menu li:hover { background-color:#f8d7da; color:#dc3545; }
        .content-area { flex:1; padding:25px; }
        .welcome-banner { background-color:#dc3545; color:white; padding:30px; border-radius:8px; margin-bottom:25px; }
        .welcome-banner h1 { font-size:28px; margin-bottom:10px; }
        .welcome-banner p { font-size:16px; opacity:0.9; }
        .stats-row { display:flex; gap:20px; margin-bottom:25px; }
        .stat-card { background-color:white; flex:1; padding:25px; text-align:center; border-radius:8px; border-top:3px solid #dc3545; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
        .stat-title { font-size:15px; color:#333; margin-bottom:10px; }
        .stat-number { font-size:36px; color:#dc3545; font-weight:600; }
        .stat-subtitle { font-size:12px; color:#999; margin-top:8px; }
        .module { background-color:white; border-radius:8px; padding:25px; box-shadow:0 2px 8px rgba(0,0,0,0.05); margin-bottom:20px; }
        .module-title { font-size:18px; color:#333; margin-bottom:15px; }
        .btn-action { background:#dc3545; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; margin-right:10px; }
    </style>
</head>
<body>
<div class="top-nav">
    <div class="nav-title">单词学习平台 - 管理员系统</div>
    <div class="user-area">
        <span class="user-name" id="admin-name">管理员</span>
        <button class="btn-logout" onclick="clearAuth()">退出登录</button>
    </div>
</div>
<div class="main-container">
    <div class="sidebar">
        <ul class="sidebar-menu">
            <li style="background:#f8d7da;color:#dc3545;">管理员首页</li>
            <li onclick="window.location.href='adminPersonal.html'">个人中心</li>
            <li onclick="window.location.href='manageUserAdmin.html'">用户管理</li>
            <li onclick="window.location.href='../wordbook/manageWordBookAdmin.html'">词书管理</li>
            <li onclick="window.location.href='../word/manageWordAdmin.html'">单词管理</li>
            <li onclick="window.location.href='../wordlearningrecord/viewUserLearningRecords.html'">学习记录查询</li>
        </ul>
    </div>
    <div class="content-area">
        <div class="welcome-banner"><h1>欢迎回来，管理员！</h1><p>今天是 <span id="today"></span></p></div>
        <div class="stats-row" id="stats"></div>
        <div class="module"><div class="module-title">快捷操作</div>
            <button class="btn-action" onclick="window.location.href='adminPersonal.html'">个人中心</button>
            <button class="btn-action" onclick="window.location.href='manageUserAdmin.html'">用户管理</button>
            <button class="btn-action" onclick="window.location.href='../wordbook/manageWordBookAdmin.html'">词书管理</button>
            <button class="btn-action" onclick="window.location.href='../word/manageWordAdmin.html'">单词管理</button>
        </div>
    </div>
</div>
<script src="../api.js"></script>
<script>
if (!requireAuth('admin')) { /* redirect */ }
document.getElementById('admin-name').textContent = '管理员：' + (localStorage.getItem('userId') || '');
document.getElementById('today').textContent = new Date().toLocaleDateString('zh-CN');

// Load simple stats
var userId = localStorage.getItem('userId') || '';
Promise.all([
    apiGet('/api/wordbooks'),
    apiGet('/api/records/stats')
]).then(function(results) {
    var books = results[0].data ? results[0].data.length : 0;
    var stats = results[1].data || {};
    document.getElementById('stats').innerHTML =
        '<div class="stat-card"><div class="stat-title">词书总数</div><div class="stat-number">' + books + '</div></div>' +
        '<div class="stat-card"><div class="stat-title">今日学习记录</div><div class="stat-number">' + (stats.todayCount||0) + '</div></div>' +
        '<div class="stat-card"><div class="stat-title">累计记录</div><div class="stat-number">' + (stats.totalCount||0) + '</div></div>';
});
</script>
</body>
</html>
