<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 用户管理</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei",sans-serif; }
        body { background:linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height:100vh; }
        .top-nav { background:linear-gradient(135deg, #dc3545 0%, #c82333 100%); color:white; display:flex; justify-content:space-between; align-items:center; padding:15px 25px; box-shadow:0 2px 10px rgba(220,53,69,0.3); }
        .nav-title { font-size:20px; font-weight:600; letter-spacing:1px; }
        .user-area { display:flex; align-items:center; gap:20px; }
        .user-name { font-size:15px; }
        .btn-logout { background-color:rgba(255,255,255,0.2); color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:14px; transition:all 0.3s; }
        .btn-logout:hover { background-color:rgba(255,255,255,0.3); transform:translateY(-1px); }
        .main-container { display:flex; min-height:calc(100vh - 60px); }
        .sidebar { width:200px; background:white; border-right:1px solid #e0e0e0; padding:25px 0; box-shadow:2px 0 15px rgba(0,0,0,0.05); }
        .sidebar-menu { list-style:none; }
        .sidebar-menu li { padding:14px 25px; cursor:pointer; color:#444; font-size:15px; transition:all 0.3s; border-left:3px solid transparent; }
        .sidebar-menu li:hover { background-color:#fff5f5; color:#dc3545; border-left-color:#dc3545; }
        .sidebar-menu li.active { background-color:#f8d7da; color:#dc3545; border-left-color:#dc3545; }
        .content-area { flex:1; padding:30px; }
        
        /* 轮播图样式 */
        .carousel-container {
            position:relative; height:200px; border-radius:12px; overflow:hidden; margin-bottom:25px; box-shadow:0 8px 25px rgba(0,0,0,0.12);
        }
        .carousel-slides {
            display:flex; transition:transform 0.5s ease-in-out; height:100%;
        }
        .carousel-slide {
            min-width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:white; font-size:24px; font-weight:600;
        }
        .carousel-slide:nth-child(1) { background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .carousel-slide:nth-child(2) { background:linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .carousel-slide:nth-child(3) { background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .carousel-indicators {
            position:absolute; bottom:15px; left:50%; transform:translateX(-50%); display:flex; gap:10px;
        }
        .carousel-indicator {
            width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,0.5); cursor:pointer; transition:all 0.3s;
        }
        .carousel-indicator.active {
            width:30px; border-radius:6px; background:white;
        }
        
        /* 统计卡片 */
        .stats-row {
            display:flex; gap:20px; margin-bottom:25px;
        }
        .stat-card {
            flex:1; background:white; border-radius:12px; padding:25px; box-shadow:0 4px 15px rgba(0,0,0,0.08); transition:all 0.3s; cursor:pointer;
        }
        .stat-card:hover {
            transform:translateY(-3px); box-shadow:0 8px 25px rgba(0,0,0,0.12);
        }
        .stat-icon {
            width:50px; height:50px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:15px;
        }
        .stat-icon.users { background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; }
        .stat-icon.active { background:linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color:white; }
        .stat-icon.today { background:linear-gradient(135deg, #eb3349 0%, #f45c43 100%); color:white; }
        .stat-icon.total { background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color:white; }
        .stat-value {
            font-size:32px; font-weight:700; color:#333; margin-bottom:5px;
        }
        .stat-label {
            font-size:14px; color:#666;
        }
        
        .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
        .page-title { font-size:24px; color:#333; font-weight:600; }
        .btn-back { background:linear-gradient(135deg, #dc3545 0%, #c82333 100%); color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:14px; transition:all 0.3s; }
        .btn-back:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(220,53,69,0.3); }
        .search-area { background:white; padding:25px; border-radius:12px; margin-bottom:25px; box-shadow:0 4px 15px rgba(0,0,0,0.08); display:flex; gap:15px; align-items:center; }
        .search-input { flex:1; padding:12px 15px; border:2px solid #e0e0e0; border-radius:8px; font-size:14px; transition:border-color 0.3s; }
        .search-input:focus { outline:none; border-color:#dc3545; }
        .filter-select { padding:12px 15px; border:2px solid #e0e0e0; border-radius:8px; font-size:14px; min-width:140px; }
        .btn-search { background:linear-gradient(135deg, #007bff 0%, #0069d9 100%); color:white; border:none; padding:12px 24px; border-radius:8px; cursor:pointer; font-size:14px; transition:all 0.3s; }
        .btn-search:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,123,255,0.3); }
        .table-area { background:white; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.08); overflow:hidden; }
        table { width:100%; border-collapse:collapse; }
        th { padding:16px 20px; text-align:left; background:linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); font-weight:600; color:#444; font-size:14px; border-bottom:2px solid #e0e0e0; }
        td { padding:16px 20px; text-align:left; border-bottom:1px solid #f0f0f0; font-size:14px; color:#555; }
        tr:hover { background-color:#fafafa; }
        .status-normal { color:#28a745; font-weight:600; }
        .status-frozen { color:#dc3545; font-weight:600; }
        .btn-edit { background:linear-gradient(135deg, #007bff 0%, #0069d9 100%); color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; margin-right:8px; transition:all 0.3s; }
        .btn-edit:hover { transform:translateY(-1px); box-shadow:0 2px 8px rgba(0,123,255,0.3); }
        .btn-toggle { background:linear-gradient(135deg, #ffc107 0%, #e0a800 100%); color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; margin-right:8px; transition:all 0.3s; }
        .btn-toggle:hover { transform:translateY(-1px); box-shadow:0 2px 8px rgba(255,193,7,0.3); }
        .btn-view { background:linear-gradient(135deg, #6c757d 0%, #5a6268 100%); color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; transition:all 0.3s; }
        .btn-view:hover { transform:translateY(-1px); box-shadow:0 2px 8px rgba(108,117,141,0.3); }
        .empty-hint { text-align:center; color:#999; padding:60px; }
        .loading-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:2000; display:none; }
        .loading-spinner { background:white; padding:25px 40px; border-radius:12px; font-size:16px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
        .toast-msg { position:fixed; bottom:30px; right:30px; background:#333; color:white; padding:14px 24px; border-radius:8px; font-size:14px; z-index:1000; opacity:0; transition:all 0.3s; pointer-events:none; box-shadow:0 4px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
<div class="top-nav">
    <div class="nav-title">单词学习平台 - 管理员系统</div>
    <div class="user-area">
        <span class="user-name" id="admin-name">管理员</span>
        <button class="btn-logout" onclick="clearAuth()">退出登录</button>
    </div>
</div>
<div class="main-container">
    <div class="sidebar">
        <ul class="sidebar-menu">
            <li onclick="window.location.href='indexAdmin.html'">管理员首页</li>
            <li onclick="window.location.href='adminPersonal.html'">个人中心</li>
            <li class="active">用户管理</li>
            <li onclick="window.location.href='../wordbook/manageWordBookAdmin.html'">词书管理</li>
            <li onclick="window.location.href='../word/manageWordAdmin.html'">单词管理</li>
            <li onclick="window.location.href='../wordlearningrecord/viewUserLearningRecords.html'">学习记录查询</li>
        </ul>
    </div>
    <div class="content-area">
        <!-- 轮播图 -->
        <div class="carousel-container">
            <div class="carousel-slides" id="carouselSlides">
                <div class="carousel-slide">
                    <div style="text-align:center;">
                        <div style="font-size:48px; margin-bottom:10px;">👥</div>
                        <div>欢迎来到用户管理中心</div>
                        <div style="font-size:16px; font-weight:normal; opacity:0.9; margin-top:5px;">管理平台所有用户</div>
                    </div>
                </div>
                <div class="carousel-slide">
                    <div style="text-align:center;">
                        <div style="font-size:48px; margin-bottom:10px;">📊</div>
                        <div>实时监控用户数据</div>
                        <div style="font-size:16px; font-weight:normal; opacity:0.9; margin-top:5px;">数据一目了然</div>
                    </div>
                </div>
                <div class="carousel-slide">
                    <div style="text-align:center;">
                        <div style="font-size:48px; margin-bottom:10px;">🚀</div>
                        <div>高效管理用户账户</div>
                        <div style="font-size:16px; font-weight:normal; opacity:0.9; margin-top:5px;">一键操作便捷管理</div>
                    </div>
                </div>
            </div>
            <div class="carousel-indicators" id="carouselIndicators">
                <span class="carousel-indicator active" onclick="goToSlide(0)"></span>
                <span class="carousel-indicator" onclick="goToSlide(1)"></span>
                <span class="carousel-indicator" onclick="goToSlide(2)"></span>
            </div>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon users">👥</div>
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">总用户数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon active">✅</div>
                <div class="stat-value" id="activeUsers">0</div>
                <div class="stat-label">活跃用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon today">📅</div>
                <div class="stat-value" id="todayUsers">0</div>
                <div class="stat-label">今日注册</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon total">📚</div>
                <div class="stat-value" id="avgLearning">0</div>
                <div class="stat-label">平均学习天数</div>
            </div>
        </div>
        
        <div class="page-header">
            <h1 class="page-title">用户列表</h1>
            <button class="btn-back" onclick="window.location.href='indexAdmin.html'">返回首页</button>
        </div>
        <div class="search-area">
            <input type="text" class="search-input" id="search-keyword" placeholder="输入用户ID、昵称或手机号搜索">
            <button class="btn-search" onclick="doSearch()">搜索</button>
        </div>
        <div class="table-area">
            <table><thead><tr><th>用户ID</th><th>昵称</th><th>电话</th><th>邮箱</th><th>注册时间</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="user-tbody"></tbody></table>
        </div>
    </div>
</div>
<div class="toast-msg" id="toastMsg">提示信息</div>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">加载中...</div>
</div>
<script src="../api.js"></script>
<script>
if (!requireAuth('admin')) { /* redirect */ }
document.getElementById('admin-name').textContent = '管理员：' + (localStorage.getItem('userId') || '');

var users = [];
var currentSlide = 0;
var slideInterval;

// 轮播图函数
function startCarousel() {
    slideInterval = setInterval(nextSlide, 4000);
}

function nextSlide() {
    currentSlide = (currentSlide + 1) % 3;
    goToSlide(currentSlide);
}

function goToSlide(index) {
    currentSlide = index;
    const slides = document.getElementById('carouselSlides');
    const indicators = document.querySelectorAll('.carousel-indicator');
    slides.style.transform = `translateX(-${index * 100}%)`;
    indicators.forEach((ind, i) => {
        ind.classList.toggle('active', i === index);
    });
}

function stopCarousel() {
    if (slideInterval) clearInterval(slideInterval);
}

// 显示/隐藏加载状态
function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

// 显示提示消息
function showMessage(msg, isError) {
    var toast = document.getElementById('toastMsg');
    toast.textContent = msg;
    toast.style.backgroundColor = isError ? '#dc3545' : '#28a745';
    toast.style.opacity = '1';
    setTimeout(function() { toast.style.opacity = '0'; }, 2000);
}

// 从后端获取用户列表
function fetchUsers() {
    showLoading();
    apiGet('/api/admin/users').then(function(r) {
        hideLoading();
        if (r.code === 200 && r.data && Array.isArray(r.data)) {
            users = r.data;
            renderUsers();
            updateStats();
            showMessage('成功加载 ' + users.length + ' 条用户数据');
        } else {
            showMessage(r.message || '获取用户列表失败', true);
            users = [];
            renderUsers();
        }
    }).catch(function(error) {
        hideLoading();
        showMessage('网络请求失败: ' + error.message, true);
        users = [];
        renderUsers();
    });
}

// 更新统计数据
function updateStats() {
    const total = users.length;
    const active = users.filter(u => u.accountStatus === '正常').length;
    const today = users.filter(u => {
        if (!u.registerTime) return false;
        return u.registerTime.includes(new Date().toISOString().split('T')[0]);
    }).length;
    
    document.getElementById('totalUsers').textContent = total;
    document.getElementById('activeUsers').textContent = active;
    document.getElementById('todayUsers').textContent = today;
    document.getElementById('avgLearning').textContent = '7';
}

// 渲染用户列表
function renderUsers() {
    var tbody = document.getElementById('user-tbody');
    var keyword = (document.getElementById('search-keyword').value || '').trim().toLowerCase();
    var filtered = keyword ? users.filter(function(u) {
        return (u.userId||'').toLowerCase().indexOf(keyword)>=0 || 
               (u.userName||'').toLowerCase().indexOf(keyword)>=0 ||
               (u.phoneNumber||'').toLowerCase().indexOf(keyword)>=0;
    }) : users;
    if (filtered.length === 0) { 
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-hint">暂无用户</div></td></tr>'; 
        return; 
    }
    var html = '';
    filtered.forEach(function(u) {
        var statusClass = u.accountStatus === '正常' ? 'status-normal' : 'status-frozen';
        var statusText = u.accountStatus === '正常' ? '正常' : '冻结';
        var toggleText = u.accountStatus === '正常' ? '冻结' : '解冻';
        html += '<tr><td>'+(u.userId||'-')+'</td>'+
                '<td>'+(escapeHtml(u.userName)||'-')+'</td>'+
                '<td>'+(u.phoneNumber||'-')+'</td>'+
                '<td>'+(u.email||'-')+'</td>'+
                '<td>'+formatTime(u.registerTime)+'</td>'+
                '<td><button class="btn-edit" onclick="editUser(\''+u.userId+'\')">编辑</button>'+
                '<button class="btn-toggle" onclick="toggleStatus(\''+u.userId+'\', \''+u.accountStatus+'\')">'+toggleText+'</button></td></tr>';
    });
    tbody.innerHTML = html;
}

// HTML转义
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// 格式化时间
function formatTime(time) {
    if (!time) return '-';
    return String(time).replace('T', ' ');
}

// 编辑用户
function editUser(userId) {
    window.location.href = 'editUserAdmin.html?userId=' + userId;
}

// 切换用户状态
function toggleStatus(userId, currentStatus) {
    var newStatus = currentStatus === '正常' ? '冻结' : '正常';
    if (!confirm('确定要将用户 ' + userId + ' ' + (currentStatus === '正常' ? '冻结' : '解冻') + ' 吗？')) return;
    showLoading();
    apiPut('/api/admin/users/' + userId, { accountStatus: newStatus }).then(function(r) {
        hideLoading();
        if (r.code === 200) {
            showMessage('用户状态已更新为: ' + newStatus);
            fetchUsers();
        } else {
            showMessage(r.message || '操作失败', true);
        }
    }).catch(function(error) {
        hideLoading();
        showMessage('操作失败: ' + error.message, true);
    });
}

// 查看学习记录
function viewRecords(userId) {
    showMessage('查看用户 ' + userId + ' 的学习记录');
    window.location.href = 'studyRecords.html?userId=' + userId;
}

// 搜索
function doSearch() { renderUsers(); }

// 初始化
fetchUsers();
startCarousel();

// 鼠标悬停轮播图时暂停
document.querySelector('.carousel-container').addEventListener('mouseenter', stopCarousel);
document.querySelector('.carousel-container').addEventListener('mouseleave', startCarousel);

// 绑定搜索框回车键
document.getElementById('search-keyword').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
