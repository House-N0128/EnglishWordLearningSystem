<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 管理员个人中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部导航 */
        .top-nav {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            box-shadow: 0 2px 15px rgba(220,53,69,0.3);
        }

        .nav-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-name {
            font-size: 15px;
        }

        .btn-logout {
            background-color: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background-color: rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        /* 主体布局 */
        .main-container {
            display: flex;
            flex: 1;
            min-height: calc(100vh - 60px);
        }

        /* 侧边栏 */
        .sidebar {
            width: 200px;
            background: white;
            border-right: 1px solid #e0e0e0;
            padding: 25px 0;
            box-shadow: 2px 0 15px rgba(0,0,0,0.05);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            padding: 14px 25px;
            cursor: pointer;
            color: #444;
            font-size: 15px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .sidebar-menu li:hover {
            background-color: #fff5f5;
            color: #dc3545;
            border-left-color: #dc3545;
        }

        .sidebar-menu li.active {
            background-color: #f8d7da;
            color: #dc3545;
            border-left-color: #dc3545;
        }

        .sidebar-menu .sub-item {
            padding-left: 45px;
            font-size: 14px;
            color: #666;
        }

        .sidebar-menu .sub-item:hover {
            background-color: #fff5f5;
            color: #dc3545;
        }

        /* 主内容区 */
        .content-area {
            flex: 1;
            padding: 35px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 26px;
            color: #333;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-icon {
            font-size: 28px;
        }

        .btn-back {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108,117,141,0.3);
        }

        /* 个人信息卡片 */
        .info-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            padding: 45px;
            max-width: 700px;
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #dc3545 0%, #c82333 100%);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }

        .card-title-section {
            flex: 1;
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .card-subtitle {
            font-size: 14px;
            color: #888;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .info-item {
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .info-item:hover {
            background: #fff5f5;
            transform: translateY(-2px);
        }

        .info-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .btn-group {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 13px 28px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-edit-pwd {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            color: white;
        }

        .btn-edit-pwd:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40,167,69,0.4);
        }

        /* 弹窗样式 */
        .modal-mask{
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:9999;
        }
        .modal-box{
            background:#fff;
            padding:30px;
            border-radius:15px;
            width:420px;
            box-shadow:0 15px 40px rgba(0,0,0,0.2);
        }
        .modal-title{
            font-size:18px;
            margin-bottom:25px;
            font-weight:600;
            color:#333;
        }
        .modal-input{
            width:100%;
            padding:14px 18px;
            border:2px solid #e0e0e0;
            border-radius:10px;
            margin-bottom:20px;
            font-size:15px;
            transition:all 0.3s;
        }
        .modal-input:focus{
            outline:none;
            border-color:#dc3545;
        }
        .modal-btn{
            display:flex;
            justify-content:flex-end;
            gap:12px;
            margin-top:25px;
        }
        .modal-confirm{
            background:linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color:#fff;
            border:none;
            padding:12px 24px;
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
            font-weight:600;
            transition:all 0.3s;
        }
        .modal-confirm:hover{
            transform:translateY(-2px);
        }
        .modal-close{
            background:linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            color:#fff;
            border:none;
            padding:12px 24px;
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
            font-weight:600;
            transition:all 0.3s;
        }
        .modal-close:hover{
            transform:translateY(-2px);
        }

        /* 提示弹窗 */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: white;
            padding: 16px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
<!-- 顶部导航 -->
<div class="top-nav">
    <div class="nav-title">单词学习平台 - 管理员系统</div>
    <div class="user-area">
        <span class="user-name" id="topAdminName">管理员</span>
        <button class="btn-logout" onclick="clearAuth()">退出登录</button>
    </div>
</div>

<!-- 主体 -->
<div class="main-container">
    <!-- 侧边导航 -->
    <div class="sidebar">
        <ul class="sidebar-menu">
            <li onclick="location.href='indexAdmin.html'">管理员首页</li>
            <li class="active">个人中心</li>
            <li onclick="location.href='manageUserAdmin.html'">用户管理</li>
            <li class="sub-item" onclick="location.href='manageUserAdmin.html'">用户管理</li>
            <li onclick="location.href='../wordbook/manageWordBookAdmin.html'">词书管理</li>
            <li class="sub-item" onclick="location.href='../wordbook/manageWordBookAdmin.html'">管理词书</li>
            <li onclick="location.href='../word/manageWordAdmin.html'">单词管理</li>
            <li class="sub-item" onclick="location.href='../word/manageWordAdmin.html'">管理单词</li>
            <li onclick="location.href='../wordlearningrecord/viewUserLearningRecords.html'">学习记录查询</li>
        </ul>
    </div>

    <!-- 内容区域 -->
    <div class="content-area">
        <div class="page-header">
            <h1 class="page-title"><span class="page-icon">👤</span>管理员个人中心</h1>
            <button class="btn-back" onclick="goAdminIndex()">🏠 返回首页</button>
        </div>

        <div class="info-card">
            <div class="card-header">
                <div class="avatar-circle">👨‍💼</div>
                <div class="card-title-section">
                    <div class="card-title">管理员个人资料</div>
                    <div class="card-subtitle">查看和管理您的管理员账户信息</div>
                </div>
            </div>
            
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">🔑 管理员账号</div>
                    <div class="info-value" id="adminUserId">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">📊 账号状态</div>
                    <div class="info-value" id="adminAccountStatus" style="color: #28a745;">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">📅 创建时间</div>
                    <div class="info-value" id="adminCreateTime">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">✅ 登录状态</div>
                    <div class="info-value" style="color:#28a745">已登录</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-action btn-edit-pwd" onclick="goChangePwd()">🔐 修改登录密码</button>
            </div>
        </div>
    </div>
</div>



<!-- 提示框 -->
<div class="toast-msg" id="toastMsg"></div>

<script src="../api.js"></script>
<script>
// 登录权限校验
if (!requireAuth('admin')) {}

// 页面跳转
function goAdminIndex(){
    location.href = "indexAdmin.html";
}
function goChangePwd(){
    location.href = "changepassword.html";
}

// 消息提示
function showMsg(text,isErr=false){
    let toast = document.getElementById("toastMsg");
    toast.innerText = text;
    toast.style.backgroundColor = isErr ? "#dc3545" : "#28a745";
    toast.style.opacity = "1";
    setTimeout(()=>{
        toast.style.opacity = "0";
    },2000)
}

// 加载管理员信息
function loadAdminInfo(){
    // 从 localStorage 获取当前登录的管理员ID
    let userId = localStorage.getItem("userId") || "admin001";
    document.getElementById("topAdminName").innerText = "管理员：" + userId;
    document.getElementById("adminUserId").innerText = userId;

    // 模拟数据库数据（必须和登录的管理员ID完全一致）
    const adminList = {
        "admin001": {
            status: "正常",
            createTime: "2024-12-01 09:00:00"
        },
        "admin002": {
            status: "正常",
            createTime: "2024-12-10 14:30:00"
        },
        "admin003": {
            status: "冻结",
            createTime: "2025-01-15 10:20:00"
        }
    };

    // 关键：必须能匹配到当前的 userId
    const admin = adminList[userId] || { status: "未知", createTime: "-" };
    
    // 更新页面显示
    document.getElementById("adminAccountStatus").innerText = admin.status;
    document.getElementById("adminCreateTime").innerText = admin.createTime;

    // 状态颜色处理
    if (admin.status === "冻结") {
        document.getElementById("adminAccountStatus").style.color = "#dc3545";
    } else if (admin.status === "正常") {
        document.getElementById("adminAccountStatus").style.color = "#28a745";
    } else {
        document.getElementById("adminAccountStatus").style.color = "#999";
    }
}

// 初始化
window.onload = function(){
    loadAdminInfo();
}
</script>
</body>
</html>
