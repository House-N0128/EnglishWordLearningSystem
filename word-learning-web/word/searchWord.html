<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 单词查询</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei",sans-serif; }
        body { background-color:#f5f5f5; display:flex; flex-direction:column; min-height:100vh; }
        .top-nav { background-color:#007bff; color:white; display:flex; justify-content:space-between; align-items:center; padding:12px 20px; }
        .nav-title { font-size:18px; font-weight:600; }
        .user-area { display:flex; align-items:center; gap:15px; }
        .user-name { font-size:15px; }
        .btn-nav { background-color:rgba(255,255,255,0.2); color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:14px; }
        .btn-nav:hover { background-color:rgba(255,255,255,0.3); }
        .main-container { display:flex; flex:1; }
        .sidebar { width:180px; background-color:white; border-right:1px solid #eee; padding:20px 0; }
        .sidebar-menu { list-style:none; }
        .sidebar-menu li { padding:12px 25px; cursor:pointer; color:#333; font-size:15px; transition:background-color 0.2s; }
        .sidebar-menu li:hover { background-color:#f0f7ff; color:#007bff; }
        .content-area { flex:1; padding:30px; }
        .query-section { background-color:white; padding:25px; border-radius:6px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
        .section-title { font-size:18px; color:#333; font-weight:500; margin-bottom:20px; padding-bottom:10px; border-bottom:1px solid #eee; }
        .query-input-wrap { display:flex; align-items:center; gap:10px; }
        .query-label { font-size:14px; color:#333; margin-bottom:8px; display:block; }
        .query-input { flex:1; padding:12px 15px; border:1px solid #ddd; border-radius:6px; font-size:14px; outline:none; }
        .query-input:focus { border-color:#007bff; }
        .btn-query { background-color:#007bff; color:white; border:none; padding:12px 20px; border-radius:6px; cursor:pointer; font-size:14px; }
        .result-section { background-color:white; padding:25px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,0.05); min-height:200px; }
        .empty-tip { font-size:16px; color:#999; text-align:center; padding:40px; }
        .word-result { border:1px solid #eee; border-radius:6px; padding:15px; margin-bottom:10px; }
        .word-result .w-name { font-size:18px; font-weight:600; color:#007bff; margin-bottom:6px; }
        .word-result .w-phonetic { font-size:14px; color:#666; margin-bottom:4px; }
        .word-result .w-meaning { font-size:14px; color:#333; margin-bottom:6px; }
        .btn-fav { background-color:#ffc107; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; margin-top:6px; }
        footer { background-color:#343a40; color:#aaa; text-align:center; padding:20px; font-size:12px; margin-top:auto; }
        .footer-links { margin-bottom:8px; }
        .footer-links a { color:#aaa; text-decoration:none; margin:0 10px; }
        .footer-links a:hover { color:white; }
    </style>
</head>
<body>
<div class="top-nav">
    <div class="nav-title">单词学习平台</div>
    <div class="user-area">
        <span class="user-name" id="display-name">用户</span>
        <button class="btn-nav" onclick="window.location.href='../user/getUserInfo.html'">个人中心</button>
        <button class="btn-nav" onclick="clearAuth()">退出登录</button>
    </div>
</div>
<div class="main-container">
    <div class="sidebar">
        <ul class="sidebar-menu">
            <li onclick="window.location.href='../user/index.html'">首页</li>
            <li onclick="window.location.href='../wordbook/browseWordBook.html'">词书浏览</li>
            <li style="background:#f0f7ff;color:#007bff;">单词查询</li>
            <li onclick="window.location.href='../collection/manageCollectedWord.html'">我的收藏</li>
            <li onclick="window.location.href='../wordlearningrecord/viewPersonalStudyRecord.html'">学习记录</li>
            <li onclick="window.location.href='../user/getUserInfo.html'">个人信息</li>
            <li onclick="window.location.href='../user/changePassword.html'">修改密码</li>
            <li onclick="window.location.href='../user/cancelUser.html'">注销账号</li>
        </ul>
    </div>
    <div class="content-area">
        <div class="query-section">
            <div class="section-title">单词查询</div>
            <label class="query-label">输入英文单词或中文释义</label>
            <div class="query-input-wrap">
                <input type="text" class="query-input" id="keyword" placeholder="请输入要查询的单词" onkeydown="if(event.key==='Enter')doSearch()">
                <button class="btn-query" onclick="doSearch()">查询</button>
            </div>
        </div>
        <div class="result-section" id="result-section">
            <div class="section-title">查询结果</div>
            <div class="empty-tip">请输入单词进行查询</div>
        </div>
    </div>
</div>
<footer>
    <div class="footer-links"><a href="#">版权信息</a><a href="#">客服链接</a></div>
    <div>版权所有 &copy; 2025 单词学习平台</div>
</footer>
<script src="../api.js"></script>
<script>
if (!requireAuth('user')) { /* redirect */ }
document.getElementById('display-name').textContent = '用户名：' + (localStorage.getItem('userId') || '');

function doSearch() {
    var kw = document.getElementById('keyword').value.trim();
    if (!kw) return;
    apiGet('/api/words/search?keyword=' + encodeURIComponent(kw)).then(function(r) {
        var container = document.getElementById('result-section');
        if (r.code === 200 && r.data.length > 0) {
            var html = '<div class="section-title">查询结果（' + r.data.length + '条）</div>';
            r.data.forEach(function(w) {
                html += '<div class="word-result">' +
                    '<div class="w-name">' + w.englishSpelling + '</div>' +
                    '<div class="w-phonetic">' + (w.phoneticSymbol || '') + '</div>' +
                    '<div class="w-meaning">' + w.chineseDefinition + '</div>' +
                    '<div class="w-meaning" style="color:#888;font-size:13px;">' + (w.exampleSentence || '') + '</div>' +
                    '<button class="btn-fav" onclick="collectWord(\'' + w.wordId + '\')">收藏单词</button>' +
                    '</div>';
            });
            container.innerHTML = html;
        } else {
            container.innerHTML = '<div class="section-title">查询结果</div><div class="empty-tip">未找到匹配单词</div>';
        }
    });
}

function collectWord(wordId) {
    apiPost('/api/collections/add', { wordId: wordId }).then(function(r) {
        alert(r.code === 200 ? '收藏成功' : r.message);
    });
}
</script>
</body>
</html>
