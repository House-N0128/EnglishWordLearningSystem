<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <div class="nav-title">单词学习平台 - 管理员系统</div>
        <div class="user-area">
            <span class="user-name">管理员账号: admin001</span>
            <button class="btn-logout" id="logoutBtn">退出登录</button>
        </div>
    </div>

    <!-- 主体内容 -->
    <div class="main-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <ul class="sidebar-menu">
                <li id="menuAdminHome">管理员首页</li>
                <li id="menuPersonal">个人中心</li>
                <li id="menuUserManage">用户管理</li>
                <li>词书管理</li>
                <li id="menuManageWord">单词管理</li>
                <li id="menuLearningRecord">学习记录查询</li>
            </ul>
        </div>

        <!-- 主内容区 -->
        <div class="content-area">
            <div class="page-header">
                <h1 class="page-title">单词详情</h1>
                <div>
                    <button class="btn btn-secondary" id="backBtn">返回</button>
                </div>
            </div>

            <!-- 单词详情卡片 -->
            <div class="detail-card" id="wordDetailCard">
                <div class="detail-header">
                    <span class="word-title" id="wordSpelling"></span>
                    <span class="phonetic-symbol" id="wordPhonetic"></span>
                </div>

                <div class="detail-section">
                    <div class="section-label">单词ID</div>
                    <div class="section-content" id="wordId"></div>
                </div>

                <div class="detail-section">
                    <div class="section-label">中文释义</div>
                    <div class="section-content definition" id="wordDefinition"></div>
                </div>

                <div class="detail-section">
                    <div class="section-label">例句</div>
                    <div class="section-content" id="wordExample"></div>
                </div>

                <div class="detail-section">
                    <div class="section-label">发音音频</div>
                    <div class="section-content audio-section">
                        <button class="play-btn" id="playAudioBtn" onclick="playAudio()" style="display: none;">
                            ▶
                        </button>
                        <span id="audioPlaceholder">暂无音频</span>
                        <audio id="audioPlayer" style="display: none;"></audio>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="section-label">示意图</div>
                    <div class="section-content image-section" id="wordImageContainer">
                        <div class="placeholder-image">暂无示意图</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loadingOverlay">
        <span class="loading-text">加载中...</span>
    </div>

    <!-- Toast消息 -->
    <div id="toastMsg"></div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        // 获取URL参数
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 显示提示消息
        function showMessage(msg, isError = false) {
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toastMsg.style.backgroundColor = isError ? "#dc3545" : "#28a745";
            toastMsg.style.opacity = "1";
            setTimeout(() => {
                toastMsg.style.opacity = "0";
            }, 2500);
        }

        // 显示/隐藏加载状态
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = "flex";
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = "none";
        }

        // 获取单词详情
        async function loadWordDetail(wordId) {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/words/${wordId}`);
                const result = await response.json();

                if (result.code === 200) {
                    renderWordDetail(result.data);
                } else {
                    showMessage('获取单词详情失败: ' + result.message, true);
                }
            } catch (error) {
                showMessage('网络请求失败: ' + error.message, true);
            } finally {
                hideLoading();
            }
        }

        // 渲染单词详情
        function renderWordDetail(word) {
            document.getElementById('wordId').textContent = word.wordId || '-';
            document.getElementById('wordSpelling').textContent = word.englishSpelling || '-';
            document.getElementById('wordPhonetic').textContent = word.phoneticSymbol || '-';
            document.getElementById('wordDefinition').textContent = word.chineseDefinition || '-';
            document.getElementById('wordExample').textContent = word.exampleSentence || '-';

            // 处理音频
            const audioUrl = word.wordPronunciation;
            if (audioUrl) {
                document.getElementById('audioPlaceholder').style.display = 'none';
                document.getElementById('playAudioBtn').style.display = 'flex';
                document.getElementById('audioPlayer').src = audioUrl;
            } else {
                document.getElementById('audioPlaceholder').style.display = 'inline';
                document.getElementById('playAudioBtn').style.display = 'none';
            }

            // 处理示意图
            const imageUrl = word.wordImage;
            const imageContainer = document.getElementById('wordImageContainer');
            if (imageUrl) {
                imageContainer.innerHTML = `<img src="${imageUrl}" alt="${word.englishSpelling}" class="word-image">`;
            } else {
                imageContainer.innerHTML = '<div class="placeholder-image">暂无示意图</div>';
            }
        }

        // 播放音频
        function playAudio() {
            const audioPlayer = document.getElementById('audioPlayer');
            if (audioPlayer.src) {
                audioPlayer.play().catch(error => {
                    showMessage('播放音频失败: ' + error.message, true);
                });
            }
        }

        // 返回
        function goBack() {
            window.history.back();
        }

        // 退出登录
        function handleLogout() {
            if (confirm("确定要退出登录吗？")) {
                localStorage.removeItem('token');
                localStorage.removeItem('userInfo');
                showMessage("已退出登录，跳转至登录页");
                setTimeout(() => {
                    window.location.href = "../admin/signin.html";
                }, 500);
            }
        }

        // 侧边栏导航
        function setupSidebarNavigation() {
            const menuItems = {
                'menuAdminHome': '../admin/indexAdmin.html',
                'menuPersonal': '../admin/adminPersonal.html',
                'menuUserManage': '../admin/manageUserAdmin.html',
                'menuManageWordBook': '../wordbook/manageWordBookAdmin.html',
                'menuAddWordBook': '../wordbook/addWordBook.html',
                'menuManageWord': 'manageWordAdmin.html',
                'menuAddWord': 'addWord.html',
                'menuBatchAddWord': 'batchAddWord.html',
                'menuLearningRecord': '../wordlearningrecord/viewUserLearningRecords.html'
            };

            Object.keys(menuItems).forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.addEventListener('click', () => {
                        window.location.href = menuItems[id];
                    });
                }
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            const wordId = getUrlParam('wordId');

            if (!wordId) {
                showMessage('未指定单词ID', true);
                return;
            }

            document.getElementById('backBtn').addEventListener('click', goBack);
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);

            setupSidebarNavigation();
            loadWordDetail(wordId);
        });
    </script>
</body>
</html>
