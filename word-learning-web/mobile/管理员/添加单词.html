<!DOCTYPE html>
<html lang="zh">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta charset="UTF-8">
<title>向词书添加单词</title>
<style>
html, body {height:100%;margin:0;padding:0;}
body {
  font-family:'PingFang SC',Arial,sans-serif;
  background:linear-gradient(135deg,#f2f8fc 0%, #eaf4ff 100%);
  display:flex;flex-direction:column;
  color:#273245;
}

/* ====== 顶栏 ====== */
.top-bar {
  display:flex;align-items:center;
  background:#318af8;color:#fff;
  padding:15px 18px 14px 6px;
  border-bottom-left-radius:18px;
  border-bottom-right-radius:18px;
  box-shadow:0 2px 12px #318af82a;
  font-size:18px;font-weight:600;gap:11px;
}
.back-btn {
  background:none;border:none;outline:none;cursor:pointer;
  padding:5px 5px 5px 2px;display:flex;align-items:center;
}
.back-icon {width:30px;height:30px;display:inline-block;}

/* ====== 内容区域 ====== */
.main-panel {
  flex-grow:1;
  overflow-y:auto;
  padding:16px;
}

.form-group {margin-bottom:12px; display:flex; flex-direction:column;}
.form-group label {margin-bottom:4px; font-weight:600; color:#318af8;}
.form-group input, .form-group select, .form-group textarea {
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #c7d9ee;
  font-size:15px;
  background:#f6f8fc;
  outline:none;
}
textarea {resize:vertical; min-height:60px;}

.btn-add {
  width:100%;
  padding:12px 0;
  background:linear-gradient(90deg,#3577ef 60%,#6cc3ff 100%);
  color:#fff;
  font-weight:600;
  font-size:17px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  margin-top:10px;
  box-shadow:0 2px 8px #e3f2fd;
  transition:background .2s, box-shadow .2s;
}
</style>
</head>
<body>

<!-- ====== 顶栏 ====== -->
<div class="top-bar">
  <button class="back-btn" onclick="window.history.back()">
    <span class="back-icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M18 6l-8 8 8 8" stroke="#fff" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>
  添加单词到词书
</div>

<div class="main-panel">

  <form id="addWordForm">

    <!-- 所属词书 -->
    <div class="form-group">
      <label for="book">所属词书</label>
      <input type="text" id="book" name="book" placeholder="如：BK001" required>
    </div>

    <div class="form-group">
      <label for="word">单词（英文）</label>
      <input type="text" id="word" name="word" placeholder="请输入单词" required>
    </div>

    <div class="form-group">
      <label for="phonetic">音标</label>
      <input type="text" id="phonetic" name="phonetic" placeholder="如：/ˈhæpi/" required>
    </div>

    <div class="form-group">
      <label for="partOfSpeech">词性</label>
      <select id="partOfSpeech" name="partOfSpeech" required>
        <option value="">请选择词性</option>
        <option value="n">名词</option>
        <option value="v">动词</option>
        <option value="adj">形容词</option>
        <option value="adv">副词</option>
        <option value="other">其他</option>
      </select>
    </div>

    <div class="form-group">
      <label for="meaning">中文释义</label>
      <input type="text" id="meaning" name="meaning" placeholder="请输入中文释义" required>
    </div>

    <div class="form-group">
      <label for="example">例句</label>
      <textarea id="example" name="example" placeholder="请输入例句" required></textarea>
    </div>

    <div class="form-group">
      <label for="audioUrl">音频链接</label>
      <input type="text" id="audioUrl" name="audioUrl" placeholder="https://..." required>
    </div>

    <div class="form-group">
      <label for="status">单词状态</label>
      <select id="status" name="status" required>
        <option value="未上架">未上架</option>
        <option value="已上架">已上架</option>
      </select>
    </div>

    <button type="submit" class="btn-add">添加单词</button>
  </form>
</div>

<script>
const form = document.getElementById('addWordForm');
form.onsubmit = function(e){
  e.preventDefault();

  const data = {
    book: form.book.value.trim(),
    word: form.word.value.trim(),
    phonetic: form.phonetic.value.trim(),
    pos: form.partOfSpeech.value,
    meaning: form.meaning.value.trim(),
    example: form.example.value.trim(),
    audioUrl: form.audioUrl.value.trim(),
    status: form.status.value
  };

  for (let key in data) {
    if (!data[key]) {
      alert("请填写所有字段！");
      return;
    }
  }

  alert(
    "单词添加成功！\n" +
    `所属词书：${data.book}\n` +
    `单词：${data.word}\n` +
    `音标：${data.phonetic}\n` +
    `词性：${data.pos}\n` +
    `释义：${data.meaning}\n` +
    `例句：${data.example}\n` +
    `音频：${data.audioUrl}\n` +
    `状态：${data.status}`
  );

  form.reset();
};
</script>

</body>
</html>
