<!DOCTYPE html>
<html lang="zh">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta charset="UTF-8">
<title>编辑词书(App端)</title>
<style>
html, body {height:100%;margin:0;padding:0;}
body {
  font-family:'PingFang SC',Arial,sans-serif;
  background:linear-gradient(135deg,#f2f8fc 0%, #eaf4ff 100%);
  display:flex;
  flex-direction:column;
  color:#273245;
}

/* 顶栏（完全复刻新增词书页面） */
.top-bar {
  display:flex;
  align-items:center;
  background:#318af8;
  color:#fff;
  padding:15px 18px 14px 6px;
  border-bottom-left-radius:18px;
  border-bottom-right-radius:18px;
  box-shadow:0 2px 12px #318af82a;
  font-size:18px;
  font-weight:600;
  gap:11px;
}
.back-btn {
  background:none;border:none;outline:none;cursor:pointer;
  padding:5px;display:flex;align-items:center;
}
.back-icon {width:30px;height:30px;display:inline-block;}

/* 主体内容 */
.main-panel {
  flex-grow:1;
  overflow-y:auto;
  padding:16px;
  padding-bottom:20px;
}

.page-title {
  font-size:19px;
  color:#318af8;
  font-weight:700;
  margin-bottom:14px;
}

.form-group {margin-bottom:12px; display:flex; flex-direction:column;}
.form-group label {
  margin-bottom:4px;
  font-weight:600;
  color:#318af8;
}
.form-group input, .form-group select, .form-group textarea {
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #c7d9ee;
  font-size:15px;
  background:#f6f8fc;
  outline:none;
}
textarea {resize:vertical; min-height:70px;}

.btn-save {
  width:100%;
  padding:12px 0;
  background:linear-gradient(90deg,#3577ef 60%,#6cc3ff 100%);
  color:#fff;
  font-weight:600;
  font-size:17px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  margin-top:10px;
  box-shadow:0 2px 8px #e3f2fd;
}
</style>
<script src="/mobile/api.js"></script>
</head>
<body>

<!-- 顶栏 -->
<div class="top-bar">
  <button class="back-btn" onclick="window.history.back()">
    <span class="back-icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M18 6l-8 8 8 8" stroke="#fff" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>
  编辑词书
</div>

<div class="main-panel">

  <div class="page-title">修改词书信息</div>

  <form id="editBookForm">

    <div class="form-group">
      <label>词书名称</label>
      <input type="text" id="bookName" placeholder="请输入词书名称" required>
    </div>

    <div class="form-group">
      <label>词书描述</label>
      <textarea id="bookDesc" placeholder="请输入词书描述"></textarea>
    </div>

    <div class="form-group">
      <label>难度等级</label>
      <select id="level" required>
        <option value="">请选择</option>
        <option value="初级">初级</option>
        <option value="中级">中级</option>
        <option value="高级">高级</option>
      </select>
    </div>

    <div class="form-group">
      <label>状态</label>
      <select id="status" required>
        <option value="">请选择</option>
        <option value="已上架">已上架</option>
        <option value="未上架">未上架</option>
      </select>
    </div>

    <button type="submit" class="btn-save">保存修改</button>

  </form>

</div>

<script>
if (!requireAuth("admin")) { throw new Error("unauthorized"); }

var params = new URLSearchParams(window.location.search);
var bookId = params.get("bookId");
if (!bookId) { showMsg("缺少词书ID参数", "error"); } else {
  apiGet("/api/wordbooks").then(function(r) {
    if (r.code === 200) {
      var books = r.data;
      for (var i=0; i<books.length; i++) {
        if (books[i].wordBookId === bookId) {
          document.getElementById("book-id").value = books[i].wordBookId;
          document.getElementById("book-name").value = books[i].wordBookName || "";
          document.getElementById("book-difficulty").value = books[i].difficultyLevel || "";
          document.getElementById("book-desc").value = books[i].wordBookDescription || "";
          break;
        }
      }
    }
  });
}

document.getElementById("submit-btn").onclick = function() {
  var b = {
    wordBookName: document.getElementById("book-name").value.trim(),
    difficultyLevel: document.getElementById("book-difficulty").value,
    wordBookDescription: document.getElementById("book-desc").value.trim()
  };
  if (!b.wordBookName) { showMsg("请填写词书名称", "error"); return; }
  apiPut("/api/wordbooks/" + bookId, b).then(function(r) {
    if (r.code === 200) { showMsg("修改已保存！", "success"); }
    else { showMsg(r.message, "error"); }
  });
};

function showMsg(msg, type) {
  var el = document.getElementById("msg");
  el.innerText = msg; el.style.display = "block";
  el.style.background = type === "success" ? "#e8f5e9" : "#fff0f0";
  el.style.color = type === "success" ? "#1b8a2e" : "#d93025";
}
</script>
