<!-- signupOrdinaryUser.html - 注册页面（无需邮箱验证） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>单词学习平台 - 注册 | 自动分配账号</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Microsoft Yahei', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px);
            background-size: 42px 42px;
            animation: bgMove 22s linear infinite;
            pointer-events: none;
        }

        @keyframes bgMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(42px, 42px); }
        }

        .register-card {
            background: rgba(255, 255, 255, 0.98);
            width: 550px;
            max-width: 100%;
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 55px -12px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            text-align: center;
            padding: 32px 20px 28px;
            position: relative;
        }

        .card-header::after {
            content: '🤖';
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 44px;
            background: white;
            width: 68px;
            height: 68px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .card-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .card-header p {
            font-size: 14px;
            opacity: 0.92;
        }

        .card-body {
            padding: 42px 38px 38px;
            background: white;
        }

        .error-msg {
            display: none;
            text-align: center;
            font-size: 13px;
            color: #c2410c;
            background: #fff1f0;
            padding: 12px 16px;
            border-radius: 24px;
            margin-bottom: 24px;
            border-left: 4px solid #ef4444;
            font-weight: 500;
        }

        .success-toast {
            background: #e0f2e9;
            color: #0b5e42;
            border-left-color: #10b981;
        }

        .auto-id-card {
            background: linear-gradient(120deg, #eef2ff 0%, #e0e7ff 100%);
            border-radius: 24px;
            padding: 14px 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .auto-id-label {
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .auto-id-value {
            font-size: 20px;
            font-weight: 700;
            font-family: monospace;
            color: #0f3b2c;
            background: white;
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            word-break: break-all;
        }

        .refresh-id-btn {
            background: #10b981;
            border: none;
            color: white;
            font-size: 12px;
            padding: 5px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .refresh-id-btn:hover {
            background: #059669;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13.5px;
            font-weight: 600;
            color: #2c3e4e;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #e67e22;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background-color: #fefefe;
        }

        .form-group input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .form-group .hint {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 6px;
        }

        .agreement {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #334155;
            margin: 22px 0 24px;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 28px;
        }

        .agreement input {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #10b981;
        }

        .agreement a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
        }

        .btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 44px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 14px;
            transition: all 0.25s;
        }

        .btn-register {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 6px 14px rgba(16, 185, 129, 0.35);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-back {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: white;
        }

        @media (max-width: 600px) {
            .card-body {
                padding: 28px 18px;
            }
        }
    </style>
</head>
<body>
<div class="register-card">
    <div class="card-header">
        <h1>📖 单词学习平台</h1>
        <p>手机号自动生成账号 · 快速注册</p>
    </div>
    <div class="card-body">
        <div class="error-msg" id="error-msg"></div>

        <!-- 系统生成的账号展示 -->
        <div class="auto-id-card">
            <div class="auto-id-label">
                <span>🔐 系统分配登录账号</span>
                <button type="button" class="refresh-id-btn" id="refreshIdBtn">⟳ 重新生成</button>
            </div>
            <div>
                <span class="auto-id-value" id="generatedUserId">——</span>
            </div>
            <div class="hint" style="margin-top: 8px;">⭐ 请牢记此账号用于登录</div>
        </div>

        <!-- 手机号输入 -->
        <div class="form-group">
            <label>📱 手机号码 <span class="required">*</span></label>
            <input type="tel" id="phoneBase" placeholder="请输入11位手机号码" autocomplete="off">
            <div class="hint">手机号将作为登录账号的基础部分</div>
        </div>

        <!-- 密码 -->
        <div class="form-group">
            <label>🔒 登录密码 <span class="required">*</span></label>
            <input type="password" id="password" placeholder="6-20位密码">
            <div class="hint">密码长度6~20位</div>
        </div>

        <!-- 确认密码 -->
        <div class="form-group">
            <label>✅ 确认密码 <span class="required">*</span></label>
            <input type="password" id="confirmPassword" placeholder="请再次输入密码">
        </div>

        <!-- 昵称 -->
        <div class="form-group">
            <label>👤 用户昵称</label>
            <input type="text" id="userName" placeholder="2~10个字符（选填）">
            <div class="hint">不填则默认使用手机号后四位</div>
        </div>

        <!-- 邮箱（选填） -->
        <div class="form-group">
            <label>📧 电子邮箱 <span style="color:#9ca3af; font-weight:normal;">（选填）</span></label>
            <input type="email" id="email" placeholder="your@example.com（用于找回密码）" autocomplete="off">
            <div class="hint">邮箱为选填项，不填也可注册</div>
        </div>

        <!-- 协议 -->
        <div class="agreement">
            <input type="checkbox" id="agreement">
            <label>我已阅读并同意 <a href="#">《用户服务协议》</a> 和 <a href="#">《隐私政策》</a></label>
        </div>

        <!-- 按钮 -->
        <button class="btn btn-register" id="registerBtn">✨ 注册新账号</button>
        <button class="btn btn-back" id="backBtn">← 返回登录</button>
    </div>
</div>

<script>
    // ==================== 配置 ====================
    const BASE_URL = 'http://localhost:8080';

    // ==================== DOM 元素 ====================
    const phoneBaseInput = document.getElementById('phoneBase');
    const generatedUserIdSpan = document.getElementById('generatedUserId');
    const refreshIdBtn = document.getElementById('refreshIdBtn');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const userNameInput = document.getElementById('userName');
    const emailInput = document.getElementById('email');
    const agreementCheck = document.getElementById('agreement');
    const registerBtn = document.getElementById('registerBtn');
    const backBtn = document.getElementById('backBtn');
    const errorMsgDiv = document.getElementById('error-msg');

    // ==================== 状态变量 ====================
    let currentGeneratedUserId = "";

    // ==================== 辅助函数 ====================
    function showError(msg, isSuccess = false) {
        errorMsgDiv.textContent = msg;
        errorMsgDiv.style.display = 'block';
        if (isSuccess) {
            errorMsgDiv.classList.add('success-toast');
        } else {
            errorMsgDiv.classList.remove('success-toast');
        }
        setTimeout(() => {
            errorMsgDiv.style.display = 'none';
        }, 4000);
    }

    function hideError() {
        errorMsgDiv.style.display = 'none';
    }

    // 生成4位时间戳（基于当前时间的分钟+秒）
    function get4DigitTimestamp() {
        const now = new Date();
        const value = (now.getMinutes() * 100 + now.getSeconds()) % 10000;
        return value.toString().padStart(4, '0');
    }

    // 生成账号：手机号 + 时间戳
    function generateUserId(phone) {
        const cleanPhone = phone.replace(/\D/g, '');
        if (cleanPhone.length < 7) return "";
        return cleanPhone + get4DigitTimestamp();
    }

    // 刷新显示的账号
    function refreshDisplayUserId() {
        const phone = phoneBaseInput.value.trim();
        if (!phone) {
            generatedUserIdSpan.innerText = "请填写手机号";
            currentGeneratedUserId = "";
            return;
        }
        const newId = generateUserId(phone);
        if (newId) {
            generatedUserIdSpan.innerText = newId;
            currentGeneratedUserId = newId;
        } else {
            generatedUserIdSpan.innerText = "手机号无效";
            currentGeneratedUserId = "";
        }
    }

    // 强制刷新账号（换一换）
    function forceRefreshUserId() {
        const phone = phoneBaseInput.value.trim();
        if (!phone) {
            showError("请先填写手机号码");
            return;
        }
        if (phone.replace(/\D/g, '').length < 11) {
            showError("请输入完整的11位手机号码");
            return;
        }
        refreshDisplayUserId();
        if (currentGeneratedUserId) {
            showError("✅ 已生成新账号: " + currentGeneratedUserId, true);
        }
    }

    // 保存注册信息到 localStorage（供登录页使用）
    function saveToLocalStorage(loginAccount) {
        localStorage.setItem('lastRegisteredAccount', loginAccount);
        localStorage.setItem('lastRegisteredTime', new Date().toISOString());
    }

    // ==================== 注册逻辑 ====================
    async function doRegister() {
        hideError();

        // 1. 获取手机号
        const phone = phoneBaseInput.value.trim();
        const cleanPhone = phone.replace(/\D/g, '');
        
        if (!phone) {
            showError("请填写手机号码");
            return;
        }
        if (cleanPhone.length !== 11) {
            showError("请输入完整的11位手机号码");
            return;
        }

        // 2. 刷新并获取生成的账号
        refreshDisplayUserId();
        const loginAccount = currentGeneratedUserId;
        if (!loginAccount || loginAccount.includes("请填写") || loginAccount.includes("无效")) {
            showError("登录账号生成失败，请重新填写手机号");
            return;
        }

        // 3. 密码校验
        const password = passwordInput.value.trim();
        const confirmPwd = confirmInput.value.trim();
        
        if (!password) {
            showError("请输入登录密码");
            return;
        }
        if (password.length < 6 || password.length > 20) {
            showError("密码长度需为6-20位");
            return;
        }
        if (password !== confirmPwd) {
            showError("两次输入的密码不一致");
            return;
        }

        // 4. 昵称（选填，默认手机号后四位）
        let nickname = userNameInput.value.trim();
        if (!nickname) {
            nickname = "用户" + cleanPhone.slice(-4);
        }
        if (nickname.length < 2 || nickname.length > 10) {
            showError("昵称长度需为2-10个字符");
            return;
        }

        // 5. 邮箱（选填）
        const email = emailInput.value.trim();

        // 6. 协议勾选
        if (!agreementCheck.checked) {
            showError("请阅读并同意《用户服务协议》和《隐私政策》");
            return;
        }

        // 7. 提交注册
        const registerData = {
            userId: loginAccount,
            loginPassword: password,
            userName: nickname,
            phoneNumber: cleanPhone
        };
        
        // 如果填写了邮箱，则添加到请求中
        if (email) {
            registerData.email = email;
        }

        registerBtn.disabled = true;
        const originalBtnText = registerBtn.innerText;
        registerBtn.innerText = "⏳ 注册中...";

        try {
            const response = await fetch(BASE_URL + '/api/user/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(registerData)
            });
            
            const result = await response.json();
            
            if (result && result.code === 200) {
                // 保存账号到 localStorage，供登录页使用
                localStorage.setItem('userNickname', nickname);
                saveToLocalStorage(loginAccount);
                
                alert(`🎉 注册成功！\n\n您的登录账号是：${loginAccount}\n请牢记此账号用于登录平台。`);
                window.location.href = "../index.html?autoFill=" + encodeURIComponent(loginAccount);
            } else {
                const errMsg = result?.message || "注册失败，请稍后重试";
                showError(errMsg);
            }
        } catch (error) {
            console.error("注册请求失败:", error);
            showError("网络错误，注册失败，请检查网络连接");
        } finally {
            registerBtn.disabled = false;
            registerBtn.innerText = originalBtnText;
        }
    }

    // ==================== 返回登录 ====================
    function goBack() {
        window.location.href = "../index.html";
    }

    // ==================== 事件绑定 ====================
    phoneBaseInput.addEventListener('input', function() {
        refreshDisplayUserId();
    });
    
    refreshIdBtn.addEventListener('click', forceRefreshUserId);
    registerBtn.addEventListener('click', doRegister);
    backBtn.addEventListener('click', goBack);

    // 回车键提交
    passwordInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') doRegister();
    });
    confirmInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') doRegister();
    });

    // 初始化
    refreshDisplayUserId();
</script>
</body>
</html>
