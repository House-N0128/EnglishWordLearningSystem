<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Microsoft Yahei', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .top-nav {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-title::before {
            content: '📖';
            font-size: 24px;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            background: rgba(255,255,255,0.2);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .btn-nav {
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-nav:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        /* 侧边栏 */
        .main-container {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 220px;
            background: white;
            border-radius: 0 20px 20px 0;
            padding: 24px 0;
            margin: 20px 0 20px 0;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            padding: 14px 28px;
            cursor: pointer;
            color: #555;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 4px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-menu li:hover {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            color: #667eea;
            transform: translateX(5px);
        }

        .sidebar-menu li:first-child {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102,126,234,0.3);
        }

        /* 内容区域 */
        .content-area {
            flex: 1;
            padding: 30px 40px;
        }

        /* 统计卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 28px 20px;
            text-align: center;
            border-radius: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .stat-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .stat-subtitle {
            font-size: 12px;
            color: #aaa;
        }

        .stat-text {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        /* 模块 */
        .module {
            background: white;
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .module-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            padding-left: 15px;
        }

        .module-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        /* 词书网格 */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: #f8f9ff;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            border: 1px solid #eef2ff;
        }

        .book-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.15);
            border-color: #667eea;
        }

        .book-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .book-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 18px;
        }

        .btn-learn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-learn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* 单词网格 */
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .word-card {
            background: #f8f9ff;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            border: 1px solid #eef2ff;
        }

        .word-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.15);
            border-color: #667eea;
        }

        .word-name {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 12px;
        }

        .word-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .btn-detail {
            background: white;
            color: #667eea;
            border: 1px solid #667eea;
            padding: 6px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-detail:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
        }

        .empty-hint {
            text-align: center;
            color: #aaa;
            padding: 40px;
            font-size: 14px;
        }

        /* 页脚 */
        footer {
            background: #2d3748;
            color: #aaa;
            text-align: center;
            padding: 25px;
            font-size: 13px;
            margin-top: auto;
        }

        .footer-links {
            margin-bottom: 10px;
        }

        .footer-links a {
            color: #aaa;
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: white;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .stats-row {
                grid-template-columns: 1fr;
            }
            .book-grid, .word-grid {
                grid-template-columns: 1fr;
            }
            .content-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="top-nav">
    <div class="nav-title">单词学习平台</div>
    <div class="user-area">
        <span class="user-name" id="display-name">用户</span>
        <button class="btn-nav" onclick="window.location.href='getUserInfo.html'">个人中心</button>
        <button class="btn-nav" onclick="clearAuth()">退出登录</button>
    </div>
</div>
<div class="main-container">
    <div class="sidebar">
        <ul class="sidebar-menu">
            <li>🏠 首页</li>
            <li onclick="window.location.href='../wordbook/browseWordBook.html'">📚 词书浏览</li>
            <li onclick="window.location.href='../word/searchWord.html'">🔍 单词查询</li>
            <li onclick="window.location.href='../collection/manageCollectedWord.html'">⭐ 我的收藏</li>
            <li onclick="window.location.href='../wordlearningrecord/viewPersonalStudyRecord.html'">📊 学习记录</li>
            <li onclick="window.location.href='getUserInfo.html'">👤 个人信息</li>
            <li onclick="window.location.href='changePassword.html'">🔐 修改密码</li>
            <li onclick="window.location.href='cancelUser.html'">🗑️ 注销账号</li>
        </ul>
    </div>
    <div class="content-area">
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-title">今日学习</div>
                <div class="stat-number" id="today-count">-</div>
                <div class="stat-subtitle">今日已学单词</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">累计学习</div>
                <div class="stat-number" id="total-count">-</div>
                <div class="stat-subtitle">累计学习单词总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">当前词书</div>
                <div class="stat-text" id="current-book">-</div>
                <div class="stat-subtitle">点击查看学习进度</div>
            </div>
        </div>
        <div class="module">
            <div class="module-title">推荐词书</div>
            <div class="book-grid" id="book-grid"></div>
        </div>
        <div class="module">
            <div class="module-title">最近学习</div>
            <div class="word-grid" id="word-grid"></div>
        </div>
    </div>
</div>
<footer>
    <div class="footer-links">
        <a href="#">版权信息</a>
        <a href="#">客服链接</a>
        <a href="#">隐私政策</a>
    </div>
    <div>版权所有 © 2025 单词学习平台 | 让学习更简单</div>
</footer>
<script src="/api.js"></script>
<script>
// 设置用户信息
if (!localStorage.getItem('userId')) {
    localStorage.setItem('userId', '10010');
    localStorage.setItem('userRole', 'USER');
}

var userId = localStorage.getItem('userId') || '';
document.getElementById('display-name').textContent = '👤 ' + userId;

// 统计数据
apiGet('/api/records/stats').then(function(r) {
    if (r.code === 200) {
        document.getElementById('today-count').textContent = r.data.todayCount || 0;
        document.getElementById('total-count').textContent = r.data.totalCount || 0;
        document.getElementById('current-book').textContent = r.data.currentBookName || '暂无';
    }
});

// 词书列表
apiGet('/api/wordbooks').then(function(r) {
    var container = document.getElementById('book-grid');
    if (r.code === 200 && r.data.length > 0) {
        var html = '';
        r.data.forEach(function(b) {
            var bookId = b.wordBookId || b.id;
            var levelIcon = b.difficultyLevel === '初级' ? '🌱' : (b.difficultyLevel === '中级' ? '📘' : '🔥');
            html += '<div class="book-card">' +
                '<div class="book-name">' + levelIcon + ' ' + b.wordBookName + '</div>' +
                '<div class="book-info"><span>难度：' + b.difficultyLevel + '</span><span>' + b.wordCount + '词</span></div>' +
                '<button class="btn-learn" onclick="window.location.href=\'../wordlearningrecord/recordWordStudy.html?bookId=' + bookId + '\'">开始学习 →</button>' +
                '</div>';
        });
        container.innerHTML = html;
    } else {
        container.innerHTML = '<div class="empty-hint">📭 暂无词书</div>';
    }
});

// 最近学习
async function loadRecentWords() {
    var container = document.getElementById('word-grid');
    container.innerHTML = '<div class="empty-hint">⏳ 加载中...</div>';
    
    try {
        const recordsRes = await apiGet('/api/records/list');
        if (recordsRes.code !== 200 || !recordsRes.data || recordsRes.data.length === 0) {
            container.innerHTML = '<div class="empty-hint">📭 暂无学习记录</div>';
            return;
        }
        
        const uniqueWordIds = [];
        const seen = new Set();
        for (let i = recordsRes.data.length - 1; i >= 0; i--) {
            const wordId = recordsRes.data[i].wordId;
            if (!seen.has(wordId)) {
                seen.add(wordId);
                uniqueWordIds.unshift(wordId);
            }
            if (uniqueWordIds.length >= 3) break;
        }
        
        if (uniqueWordIds.length === 0) {
            container.innerHTML = '<div class="empty-hint">📭 暂无学习记录</div>';
            return;
        }
        
        var html = '';
        for (var wordId of uniqueWordIds) {
            try {
                const wordRes = await apiGet('/api/words/' + wordId);
                if (wordRes.code === 200) {
                    var w = wordRes.data;
                    var spelling = w.spelling || w.englishSpelling || '-';
                    var definition = w.definition || w.chineseDefinition || '-';
                    var wordName = encodeURIComponent(spelling);
                    html += '<div class="word-card">' +
                        '<div class="word-name">📖 ' + spelling + '</div>' +
                        '<div class="word-desc">释义：' + definition.substring(0, 50) + (definition.length > 50 ? '...' : '') + '</div>' +
                        '<button class="btn-detail" onclick="window.location.href=\'../word/viewWordDetail.html?word=' + wordName + '\'">查看详情 →</button>' +
                        '</div>';
                }
            } catch(e) {
                console.log('获取单词详情失败:', wordId);
            }
        }
        container.innerHTML = html || '<div class="empty-hint">📭 暂无学习记录</div>';
        
    } catch (err) {
        console.error('加载失败:', err);
        container.innerHTML = '<div class="empty-hint">⚠️ 加载失败，请稍后重试</div>';
    }
}

loadRecentWords();
</script>
</body>
</html>
