<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 编辑词书</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .top-nav {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            box-shadow: 0 2px 15px rgba(220,53,69,0.3);
        }

        .nav-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-name {
            font-size: 15px;
        }

        .btn-logout {
            background-color: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background-color: rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        /* 主体布局 */
        .main-container {
            display: flex;
            flex: 1;
            min-height: calc(100vh - 60px);
        }

        /* 左侧侧边栏 */
        .sidebar {
            width: 200px;
            background: white;
            border-right: 1px solid #e0e0e0;
            padding: 25px 0;
            box-shadow: 2px 0 15px rgba(0,0,0,0.05);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            padding: 14px 25px;
            cursor: pointer;
            color: #444;
            font-size: 15px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .sidebar-menu li:hover {
            background-color: #fff5f5;
            color: #dc3545;
            border-left-color: #dc3545;
        }

        .sidebar-menu li.active {
            background-color: #f8d7da;
            color: #dc3545;
            border-left-color: #dc3545;
        }

        .sidebar-menu .sub-item {
            padding-left: 45px;
            font-size: 14px;
            color: #666;
        }

        .sidebar-menu .sub-item:hover {
            background-color: #fff5f5;
            color: #dc3545;
        }

        /* 右侧主内容区 */
        .content-area {
            flex: 1;
            padding: 35px;
        }

        .page-title {
            font-size: 26px;
            color: #333;
            font-weight: 600;
            margin-bottom: 35px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-icon {
            font-size: 28px;
        }

        /* 表单卡片 */
        .form-card {
            background: white;
            width: 550px;
            margin: 0 auto;
            border-radius: 15px;
            padding: 45px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #007bff 0%, #0069d9 100%);
        }

        .card-header {
            padding-bottom: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            font-size: 15px;
            color: #444;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            background: #fafafa;
        }

        .form-input:focus {
            border-color: #007bff;
            background: white;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .form-input:disabled {
            background: #f0f0f0;
            color: #888;
            cursor: not-allowed;
        }

        .form-textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            min-height: 120px;
            resize: vertical;
            outline: none;
            transition: all 0.3s;
            background: #fafafa;
        }

        .form-textarea:focus {
            border-color: #007bff;
            background: white;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .form-select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            background: #fafafa;
            outline: none;
            transition: all 0.3s;
        }

        .form-select:focus {
            border-color: #007bff;
            background: white;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .input-tip {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 13px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-save {
            background: linear-gradient(135deg, #007bff 0%, #0069d9 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,123,255,0.4);
        }

        .btn-cancel {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            color: white;
        }

        .btn-cancel:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108,117,141,0.4);
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: white;
            padding: 16px 24px;
            border-radius: 10px;
            font-size: 15px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            display: none;
        }

        .loading-spinner {
            background: white;
            padding: 30px 45px;
            border-radius: 15px;
            font-size: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
    <script src="../api.js"></script>
</head>
<body>
<!-- 顶部导航栏 -->
<div class="top-nav">
    <div class="nav-title">单词学习平台 - 管理员系统</div>
    <div class="user-area">
        <span class="user-name">管理员账号：admin</span>
        <button class="btn-logout">退出登录</button>
    </div>
</div>

<!-- 主体内容 -->
<div class="main-container">
    <!-- 左侧侧边栏 -->
    <div class="sidebar">
        <ul class="sidebar-menu">
            <li>管理员首页</li>
            <li>个人中心</li>
            <li>用户管理</li>
            <li class="sub-item">用户管理</li>
            <li class="active">词书管理</li>
            <li class="sub-item">管理词书</li>
            <li>单词管理</li>
            <li class="sub-item">管理单词</li>
            <li>学习记录查询</li>
        </ul>
    </div>

    <!-- 右侧主内容区 -->
    <div class="content-area">
        <div class="page-title"><span class="page-icon">✏️</span>编辑词书</div>
        <div class="form-card">
            <div class="card-header">
                <div class="card-title">📝 修改词书信息</div>
            </div>
            <div class="form-group">
                <label class="form-label">🆔 词书ID</label>
                <input type="text" class="form-input" id="bookId" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">📖 词书名称</label>
                <input type="text" class="form-input" id="bookName" placeholder="请输入词书名称">
                <div class="input-tip">💡 词书名称应简洁明了，便于用户识别</div>
            </div>
            <div class="form-group">
                <label class="form-label">🎯 难度等级</label>
                <select class="form-select" id="difficultyLevel">
                    <option>🌱 初级</option>
                    <option>🌿 中级</option>
                    <option>🌳 高级</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">📋 词书描述</label>
                <textarea class="form-textarea" id="bookDesc" placeholder="请输入词书描述"></textarea>
                <div class="input-tip">💡 描述词书的特点、适用人群和学习目标</div>
            </div>
            <div class="form-group">
                <label class="form-label">🔤 单词数量</label>
                <input type="number" class="form-input" id="wordCount" placeholder="请输入单词数量">
                <div class="input-tip">💡 词书包含的单词总数</div>
            </div>
            <div class="form-group">
                <label class="form-label">📊 词书状态</label>
                <select class="form-select" id="bookStatus">

                </select>
                <div class="input-tip">💡 未上线的词书用户无法看到</div>
            </div>
            <div class="btn-group">
                <button class="btn btn-save" onclick="saveWordBook()">💾 保存修改</button>

            </div>

    </div>
</div>
<div class="toast-msg" id="toastMsg">提示信息</div>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">保存中...</div>
</div>
<script>
var currentBookId = '';

function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

function showMessage(msg, isError) {
    var toast = document.getElementById('toastMsg');
    toast.textContent = msg;
    toast.style.backgroundColor = isError ? '#dc3545' : '#28a745';
    toast.style.opacity = '1';
    setTimeout(function() { toast.style.opacity = '0'; }, 2000);
}

function loadBookInfo() {
    var params = new URLSearchParams(window.location.search);
    currentBookId = params.get('bookId');
    if (!currentBookId) {
        showMessage('缺少词书ID', true);
        return;
    }
    
    showLoading();
    apiGet('/api/wordbooks').then(function(r) {
        hideLoading();
        if (r.code === 200 && r.data && r.data.length > 0) {
            var book = r.data.find(function(b) { return b.wordBookId === currentBookId; });
            if (book) {
                document.getElementById('bookId').value = book.wordBookId || '';
                document.getElementById('bookName').value = book.wordBookName || '';
                document.getElementById('difficultyLevel').value = book.difficultyLevel || '中级';
                document.getElementById('bookDesc').value = book.wordBookDescription || '';
                document.getElementById('wordCount').value = book.wordCount || 0;
                document.getElementById('bookStatus').value = book.wordBookStatus || '已上线';
            } else {
                showMessage('未找到词书信息', true);
            }
        } else {
            showMessage(r.message || '获取词书信息失败', true);
        }
    }).catch(function(error) {
        hideLoading();
        showMessage('获取词书信息失败: ' + error.message, true);
    });
}

function saveWordBook() {
    var data = {
        wordBookName: document.getElementById('bookName').value.trim(),
        difficultyLevel: document.getElementById('difficultyLevel').value,
        wordBookDescription: document.getElementById('bookDesc').value.trim(),
        wordCount: parseInt(document.getElementById('wordCount').value) || 0,
        wordBookStatus: document.getElementById('bookStatus').value
    };
    
    if (!data.wordBookName) {
        showMessage('请输入词书名称', true);
        return;
    }
    
    showLoading();
    apiPut('/api/wordbooks/' + currentBookId, data).then(function(r) {
        hideLoading();
        if (r.code === 200) {
            showMessage('词书信息修改成功');
            setTimeout(function() { window.location.href = 'manageWordBookAdmin.html'; }, 1500);
        } else {
            showMessage(r.message || '修改失败', true);
        }
    }).catch(function(error) {
        hideLoading();
        showMessage('修改失败: ' + error.message, true);
    });
}

function goBack() {
    window.location.href = 'manageWordBookAdmin.html';
}

// 侧边栏菜单交互
document.querySelectorAll('.sidebar-menu li').forEach(function(item) {
    item.addEventListener('click', function(e) {
        e.stopPropagation();
        var text = item.innerText.trim();
        if (text === '词书管理' || text === '管理词书') {
            window.location.href = 'manageWordBookAdmin.html';
        } else if (text === '管理员首页') {
            window.location.href = '../admin/indexAdmin.html';
        } else if (text === '个人中心') {
            window.location.href = '../admin/adminPersonal.html';
        } else if (text === '用户管理') {
            window.location.href = '../admin/manageUserAdmin.html';
        } else if (text === '单词管理' || text === '管理单词') {
            window.location.href = '../word/manageWordAdmin.html';
        } else if (text === '学习记录查询') {
            window.location.href = '../wordlearningrecord/viewUserLearningRecords.html';
        }
    });
});

loadBookInfo();
</script>
</body>
</html>
