<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习平台 - 给词书添加单词</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-nav {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            box-shadow: 0 2px 15px rgba(220,53,69,0.3);
        }

        .nav-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-name {
            font-size: 15px;
        }

        .btn-logout {
            background-color: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background-color: rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        .main-container {
            display: flex;
            flex: 1;
            min-height: calc(100vh - 60px);
        }

        .sidebar {
            width: 200px;
            background: white;
            border-right: 1px solid #e0e0e0;
            padding: 25px 0;
            box-shadow: 2px 0 15px rgba(0,0,0,0.05);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            padding: 14px 25px;
            cursor: pointer;
            color: #444;
            font-size: 15px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .sidebar-menu li:hover,
        .sidebar-menu li.active {
            background-color: #fff5f5;
            color: #dc3545;
            border-left-color: #dc3545;
        }

        .sidebar-menu .sub-item {
            padding-left: 45px;
            font-size: 14px;
            color: #666;
        }

        .content-area {
            flex: 1;
            padding: 35px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 26px;
            color: #333;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-icon {
            font-size: 28px;
        }

        .header-info {
            font-size: 15px;
            color: #666;
            margin-top: 8px;
            padding: 10px 15px;
            background: #fff9c4;
            border-radius: 8px;
            display: inline-block;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108,117,141,0.4);
        }

        .btn-green {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            color: white;
        }

        .btn-green:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40,167,69,0.4);
        }

        .btn-blue {
            background: linear-gradient(135deg, #007bff 0%, #0069d9 100%);
            color: white;
        }

        .btn-blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,123,255,0.4);
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            padding: 30px;
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            color: #444;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: #fafafa;
        }

        .form-control:focus {
            outline: none;
            border-color: #dc3545;
            background: white;
            box-shadow: 0 0 0 3px rgba(220,53,69,0.1);
        }

        .input-tip {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .upload-area {
            border: 2px dashed #e0e0e0;
            border-radius: 15px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }

        .upload-area:hover {
            border-color: #dc3545;
            background: #fff5f5;
        }

        .upload-area.dragover {
            border-color: #dc3545;
            background: #fff5f5;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 16px;
            color: #444;
            font-weight: 500;
        }

        .upload-hint {
            font-size: 13px;
            color: #888;
            margin-top: 10px;
        }

        #fileInput {
            display: none;
        }

        .table-area {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
        }

        th {
            background: linear-gradient(90deg, #f8f9fa 0%, #e9ecef 100%);
            font-weight: 600;
            color: #444;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }

        tr {
            transition: all 0.3s;
        }

        tr:hover {
            background-color: #fff8f0;
            transform: scale(1.002);
        }

        .status-success {
            color: #28a745;
            font-weight: 600;
        }

        .status-error {
            color: #dc3545;
            font-weight: 600;
        }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-text {
            color: white;
            font-size: 16px;
            background: rgba(255,255,255,0.1);
            padding: 20px 40px;
            border-radius: 10px;
        }

        #toastMsg {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 28px;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .tab-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 14px 28px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            background-color: white;
            transition: all 0.3s;
        }

        .tab-btn:hover:not(.active) {
            border-color: #dc3545;
            color: #dc3545;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            border-color: #dc3545;
            box-shadow: 0 5px 15px rgba(220,53,69,0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .search-results {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            display: none;
            background: white;
        }

        .search-result-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-result-item:hover {
            background-color: #fff5f5;
            padding-left: 25px;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .result-word {
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        .result-definition {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .search-tip {
            font-size: 13px;
            color: #888;
            padding: 15px;
            text-align: center;
        }

        .selected-badge {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            margin-left: 12px;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="nav-title">单词学习平台 - 管理员系统</div>
        <div class="user-area">
            <span class="user-name">管理员账号: admin001</span>
            <button class="btn-logout" id="logoutBtn">退出登录</button>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <ul class="sidebar-menu">
                <li id="menuAdminHome">管理员首页</li>
                <li id="menuPersonal">个人中心</li>
                <li id="menuUserManage">用户管理</li>
                <li class="active">词书管理</li>
                <li id="menuManageWord">单词管理</li>
                <li id="menuLearningRecord">学习记录查询</li>
            </ul>
        </div>

        <div class="content-area">
            <div class="page-header">
                <div>
                    <h1 class="page-title"><span class="page-icon">➕</span>给词书添加单词</h1>
                    <div class="header-info" id="bookInfo"></div>
                </div>
                <div>
                    <button class="btn btn-secondary" id="backBtn">🔙 返回词书管理</button>
                </div>
            </div>

            <div class="tab-container">
                <button class="tab-btn active" id="singleTab">📝 单个添加</button>
                <button class="tab-btn" id="batchTab">📊 批量添加</button>
            </div>

            <div class="card tab-content active" id="singleForm">
                <div class="card-title">📝 单个添加单词</div>
                <form id="singleAddForm">
                    <div class="form-group">
                        <label>🔤 英文拼写 * <span style="font-weight:normal;color:#999;">- 输入后自动搜索已有单词</span></label>
                        <input type="text" class="form-control" id="englishSpelling" placeholder="请输入英文单词">
                        <div class="search-results" id="searchResults"></div>
                    </div>
                    <div class="form-group">
                        <label>📖 中文释义 *</label>
                        <input type="text" class="form-control" id="chineseDefinition" placeholder="请输入中文释义">
                    </div>
                    <div class="form-group">
                        <label>🔊 音标</label>
                        <input type="text" class="form-control" id="phoneticSymbol" placeholder="请输入音标">
                    </div>
                    <div class="form-group">
                        <label>🏷️ 词性</label>
                        <select class="form-control" id="partOfSpeech">
                            <option value="">请选择词性</option>
                            <option value="n.">📌 名词 (n.)</option>
                            <option value="v.">🎯 动词 (v.)</option>
                            <option value="adj.">🌈 形容词 (adj.)</option>
                            <option value="adv.">⚡ 副词 (adv.)</option>
                            <option value="prep.">🔗 介词 (prep.)</option>
                            <option value="conj.">🔄 连词 (conj.)</option>
                            <option value="pron.">👤 代词 (pron.)</option>
                            <option value="num.">🔢 数词 (num.)</option>
                            <option value="interj.">💬 感叹词 (interj.)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>💬 例句</label>
                        <textarea class="form-control" id="exampleSentence" rows="3" placeholder="请输入例句"></textarea>
                    </div>
                    <div class="form-group">
                        <label>🔊 音频链接</label>
                        <input type="text" class="form-control" id="wordPronunciation" placeholder="请输入单词发音音频URL">
                        <div class="input-tip">💡 支持 MP3、WAV 等格式的音频链接</div>
                    </div>
                    <div class="form-group">
                        <label>🖼️ 图片链接</label>
                        <input type="text" class="form-control" id="wordImage" placeholder="请输入单词示意图URL">
                        <div class="input-tip">💡 支持 JPG、PNG、GIF 等格式的图片链接</div>
                    </div>
                    <div class="form-group">
                        <label>🔄 添加方式</label>
                        <div style="display:flex;gap:30px;">
                            <label style="cursor:pointer;font-size:15px;">
                                <input type="radio" name="addType" value="new" checked> ✨ 新建单词
                            </label>
                            <label style="cursor:pointer;font-size:15px;">
                                <input type="radio" name="addType" value="existing" id="existingRadio"> 🔍 选择已有单词
                            </label>
                        </div>
                        <input type="hidden" id="selectedWordId">
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-green">✅ 添加到词书</button>
                        <button type="button" class="btn btn-secondary" onclick="clearSingleForm()">🔄 重置</button>
                    </div>
                </form>
            </div>

            <div class="card tab-content" id="batchForm">
                <div class="card-title">📊 批量添加单词</div>
                
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击选择 Excel 文件或拖拽文件到这里</div>
                    <div class="upload-hint">支持 .xlsx 格式，文件大小不超过 10MB</div>
                    <input type="file" id="fileInput" accept=".xlsx,.xls">
                </div>

                <div style="margin-top: 25px;">
                    <button class="btn btn-blue" id="downloadTemplateBtn">📥 下载模板文件</button>
                </div>

                <div id="batchResult" style="display:none; margin-top: 25px;">
                    <h4 style="margin-bottom: 20px;font-size:18px;font-weight:600;color:#333;">📋 导入结果</h4>
                    <div class="table-area">
                        <table>
                            <thead>
                                <tr>
                                    <th>📋 序号</th>
                                    <th>🔤 英文拼写</th>
                                    <th>📖 中文释义</th>
                                    <th>📊 状态</th>
                                    <th>📝 备注</th>
                                </tr>
                            </thead>
                            <tbody id="resultTableBody">
                            </tbody>
                        </table>
                    </div>
                    <div style="margin-top: 20px; font-size: 15px;">
                        <span style="color:#28a745;font-weight:600;">✅ 成功: <span id="successCount">0</span> 个</span>
                        <span style="margin-left: 30px; color:#dc3545;font-weight:600;">❌ 失败: <span id="failCount">0</span> 个</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loadingOverlay">
        <span class="loading-text">处理中...</span>
    </div>

    <div id="toastMsg"></div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function showMessage(msg, isError = false) {
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toastMsg.style.backgroundColor = isError ? "#dc3545" : "#28a745";
            toastMsg.style.opacity = "1";
            setTimeout(() => {
                toastMsg.style.opacity = "0";
            }, 2500);
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = "flex";
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = "none";
        }

        document.getElementById('singleTab').addEventListener('click', () => {
            document.getElementById('singleTab').classList.add('active');
            document.getElementById('batchTab').classList.remove('active');
            document.getElementById('singleForm').classList.add('active');
            document.getElementById('batchForm').classList.remove('active');
        });

        document.getElementById('batchTab').addEventListener('click', () => {
            document.getElementById('batchTab').classList.add('active');
            document.getElementById('singleTab').classList.remove('active');
            document.getElementById('batchForm').classList.add('active');
            document.getElementById('singleForm').classList.remove('active');
        });

        let searchTimer = null;
        document.getElementById('englishSpelling').addEventListener('input', (e) => {
            const keyword = e.target.value.trim();
            
            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('selectedWordId').value = '';
            document.getElementById('existingRadio').checked = false;
            
            if (!keyword) {
                return;
            }

            if (searchTimer) {
                clearTimeout(searchTimer);
            }
            
            searchTimer = setTimeout(async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/words/search?keyword=${encodeURIComponent(keyword)}`);
                    const data = await response.json();
                    displaySearchResults(data);
                } catch (error) {
                    console.error('搜索失败:', error);
                }
            }, 300);
        });

        function displaySearchResults(words) {
            const searchResults = document.getElementById('searchResults');
            if (!words || words.length === 0) {
                searchResults.innerHTML = '<div class="search-tip">未找到匹配的单词</div>';
                searchResults.style.display = 'block';
                return;
            }

            searchResults.innerHTML = words.map(word => `
                <div class="search-result-item" onclick="selectExistingWord('${word.id}', '${word.spelling}', '${word.definition}', '${word.phonetic || ''}', '${word.partOfSpeech || ''}', '${word.exampleSentence || ''}', '${word.pronunciation || ''}', '${word.image || ''}')">
                    <div class="result-word">${word.spelling} ${word.partOfSpeech ? `(${word.partOfSpeech})` : ''}</div>
                    <div class="result-definition">${word.definition}</div>
                </div>
            `).join('');
            searchResults.style.display = 'block';
        }

        function selectExistingWord(wordId, spelling, definition, phonetic, partOfSpeech, example, pronunciation, image) {
            document.getElementById('englishSpelling').value = spelling;
            document.getElementById('chineseDefinition').value = definition;
            document.getElementById('phoneticSymbol').value = phonetic;
            document.getElementById('partOfSpeech').value = partOfSpeech;
            document.getElementById('exampleSentence').value = example;
            document.getElementById('wordPronunciation').value = pronunciation;
            document.getElementById('wordImage').value = image;
            document.getElementById('selectedWordId').value = wordId;
            document.getElementById('existingRadio').checked = true;
            document.getElementById('searchResults').style.display = 'none';
        }

        function clearSingleForm() {
            document.getElementById('singleAddForm').reset();
            document.getElementById('selectedWordId').value = '';
            document.getElementById('searchResults').style.display = 'none';
        }

        document.getElementById('singleAddForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const wordBookId = getUrlParam('wordBookId');
            if (!wordBookId) {
                showMessage('词书ID无效', true);
                return;
            }

            const selectedWordId = document.getElementById('selectedWordId').value;
            const addType = document.querySelector('input[name="addType"]:checked').value;

            showLoading();

            try {
                let response;
                
                if (addType === 'existing' && selectedWordId) {
                    // 添加已有单词到词书
                    response = await fetch(`${API_BASE_URL}/wordbooks/${wordBookId}/words/${selectedWordId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                } else {
                    // 添加新单词
                    const wordData = {
                        spelling: document.getElementById('englishSpelling').value,
                        definition: document.getElementById('chineseDefinition').value,
                        phonetic: document.getElementById('phoneticSymbol').value,
                        partOfSpeech: document.getElementById('partOfSpeech').value,
                        exampleSentence: document.getElementById('exampleSentence').value,
                        pronunciation: document.getElementById('wordPronunciation').value,
                        image: document.getElementById('wordImage').value
                    };

                    response = await fetch(`${API_BASE_URL}/wordbooks/${wordBookId}/words`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(wordData)
                    });
                }

                if (response.ok) {
                    showMessage('添加成功！');
                    clearSingleForm();
                } else {
                    const errorData = await response.json();
                    showMessage(errorData.message || '添加失败', true);
                }
            } catch (error) {
                console.error('添加失败:', error);
                showMessage('添加失败，请稍后重试', true);
            } finally {
                hideLoading();
            }
        });

        document.getElementById('uploadArea').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('uploadArea').addEventListener('dragover', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.add('dragover');
        });

        document.getElementById('uploadArea').addEventListener('dragleave', () => {
            document.getElementById('uploadArea').classList.remove('dragover');
        });

        document.getElementById('uploadArea').addEventListener('drop', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileUpload(files[0]);
            }
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFileUpload(file);
            }
        });

        function handleFileUpload(file) {
            if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
                showMessage('请选择Excel文件', true);
                return;
            }

            const wordBookId = getUrlParam('wordBookId');
            if (!wordBookId) {
                showMessage('词书ID无效', true);
                return;
            }

            showLoading();

            const formData = new FormData();
            formData.append('file', file);

            fetch(`${API_BASE_URL}/wordbooks/${wordBookId}/words/batch`, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();
                displayBatchResult(data);
            })
            .catch(error => {
                hideLoading();
                console.error('批量导入失败:', error);
                showMessage('批量导入失败，请稍后重试', true);
            });
        }

        function displayBatchResult(results) {
            const resultTableBody = document.getElementById('resultTableBody');
            const successCount = document.getElementById('successCount');
            const failCount = document.getElementById('failCount');

            resultTableBody.innerHTML = results.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.spelling || '-'}</td>
                    <td>${item.definition || '-'}</td>
                    <td class="${item.success ? 'status-success' : 'status-error'}">
                        ${item.success ? '成功' : '失败'}
                    </td>
                    <td>${item.message || '-'}</td>
                </tr>
            `).join('');

            const success = results.filter(r => r.success).length;
            successCount.textContent = success;
            failCount.textContent = results.length - success;

            document.getElementById('batchResult').style.display = 'block';
        }

        document.getElementById('downloadTemplateBtn').addEventListener('click', () => {
            const templateContent = `英文拼写,词性,中文释义,音标,例句,音频链接,图片链接
abandon,v.,抛弃，放弃,/əˈbændən/,He abandoned his plan.,,
ability,n.,能力，才能,/əˈbɪləti/,She has the ability to learn quickly.,,
absolutely,adv.,绝对地，完全地,/ˈæbsəluːtli/,I absolutely agree with you.,,
absorb,v.,吸收，吸引,/əbˈsɔːrb/,Plants absorb carbon dioxide.,,
abstract,adj.,抽象的,/ˈæbstrækt/,This is an abstract concept.,,`;

            const blob = new Blob([templateContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'word_import_template.csv';
            link.click();
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'manageWordBookAdmin.html';
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            window.location.href = '../login.html';
        });

        document.getElementById('menuAdminHome').addEventListener('click', () => {
            window.location.href = '../admin/indexAdmin.html';
        });

        document.getElementById('menuPersonal').addEventListener('click', () => {
            window.location.href = '../admin/adminPersonal.html';
        });

        document.getElementById('menuUserManage').addEventListener('click', () => {
            window.location.href = '../admin/manageUserAdmin.html';
        });

        document.getElementById('menuManageWord').addEventListener('click', () => {
            window.location.href = '../word/manageWordAdmin.html';
        });

        document.getElementById('menuLearningRecord').addEventListener('click', () => {
            window.location.href = 'learningRecordQuery.html';
        });

        // 页面加载时获取词书信息
        document.addEventListener('DOMContentLoaded', async () => {
            const wordBookId = getUrlParam('wordBookId');
            if (wordBookId) {
                try {
                    const response = await fetch(`${API_BASE_URL}/wordbooks/${wordBookId}`);
                    const data = await response.json();
                    document.getElementById('bookInfo').textContent = `当前词书: ${data.name || '未知'} | 难度等级: ${data.level || '未设置'}`;
                } catch (error) {
                    console.error('获取词书信息失败:', error);
                }
            }
        });
    </script>
</body>
